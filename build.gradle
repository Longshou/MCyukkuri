plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// P0 acceptance code is a separate development mod and is never included in the release jar.
sourceSets { p0Test }
dependencies { p0TestImplementation sourceSets.main.output }

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

neoForge {
    addModdingDependenciesTo sourceSets.p0Test
    mods { mcyukkuri_p0 { sourceSet(sourceSets.p0Test) } }
    runs {
        configureEach { loadedMods = [mods.mcyukkuri] }
        p0GameTest {
            type = 'gameTestServer'
            gameDirectory = file('.local/p0/gametest')
            loadedMods = [mods.mcyukkuri, mods.mcyukkuri_p0]
            sourceSet = sourceSets.p0Test
            systemProperty 'mcyukkuri.p0', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mcyukkuri_p0'
        }
        p0Preview {
            client()
            gameDirectory = file('.local/p0/preview')
            programArguments.addAll '--username', 'P0Preview', '--width', '1280', '--height', '800',
                    '--quickPlaySingleplayer', 'p0-preview'
            jvmArgument '-Xmx2G'
            loadedMods = [mods.mcyukkuri, mods.mcyukkuri_p0]
            sourceSet = sourceSets.p0Test
            systemProperty 'mcyukkuri.p0', 'true'
        }
        p0Server {
            server()
            gameDirectory = file('.local/p0/server')
            programArgument '--nogui'
            jvmArgument '-Xmx2G'
            loadedMods = [mods.mcyukkuri, mods.mcyukkuri_p0]
            sourceSet = sourceSets.p0Test
            systemProperty 'mcyukkuri.p0', 'true'
        }
        p0ClientA {
            client()
            gameDirectory = file('.local/p0/client-a')
            programArguments.addAll '--username', 'P0ObserverA', '--width', '1280', '--height', '800',
                    '--quickPlayMultiplayer', '127.0.0.1:25586'
            jvmArgument '-Xmx2G'
            loadedMods = [mods.mcyukkuri, mods.mcyukkuri_p0]
            sourceSet = sourceSets.p0Test
            systemProperty 'mcyukkuri.p0', 'true'
        }
        p0ClientB {
            client()
            gameDirectory = file('.local/p0/client-b')
            programArguments.addAll '--username', 'P0ObserverB', '--width', '960', '--height', '640',
                    '--quickPlayMultiplayer', '127.0.0.1:25586'
            jvmArgument '-Xmx2G'
            loadedMods = [mods.mcyukkuri, mods.mcyukkuri_p0]
            sourceSet = sourceSets.p0Test
            systemProperty 'mcyukkuri.p0', 'true'
        }
    }
}

tasks.named('check') { dependsOn tasks.named('compileP0TestJava') }

sourceSets { fingerprintTest }
dependencies { fingerprintTestImplementation sourceSets.main.output }
def verifyModelFingerprint = tasks.register('verifyModelFingerprint', JavaExec) {
    dependsOn tasks.named('fingerprintTestClasses')
    classpath = sourceSets.fingerprintTest.runtimeClasspath
    mainClass = 'io.github.longshou.mcyukkuri.body.ModelFingerprintTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn verifyModelFingerprint }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, loader_version_range: loader_version_range
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir generateModMetadata
    exclude '**/.cache/**', '**/*.bbmodel'
}
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
idea.module.downloadSources = true
