name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset validation dependencies
        run: python -m pip install Pillow==12.3.0
      - name: Test asset validators
        shell: bash
        run: |
          python scripts/test_runtime_model_fingerprint.py
          python scripts/test_runtime_atlas.py
          python scripts/test_validate_entity_assets.py
          python scripts/test_asset_export_checks.py
          python scripts/test_operation_exports.py
      - name: Check packaged entity assets
        run: python scripts/validate_entity_assets.py
      - name: Check living facility exports
        run: python scripts/export_living_assets.py --check
      - name: Check family presentation exports
        run: python scripts/export_family_assets.py --check
      - name: Check house and care exports
        run: python scripts/export_house_assets.py --check
      - name: Check selected peripheral exports
        run: python scripts/export_peripheral_assets.py --check
      - name: Check operation tool exports
        run: python standards/yukkuri-library/drafts/operation-tools/build.py --check
      - name: Build mod
        run: ./gradlew build --no-daemon
        shell: bash
      - name: Run full integration GameTests
        run: ./gradlew runP0GameTest --no-daemon
        shell: bash
      - name: Upload P0 assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-checks-${{ matrix.os }}-${{ github.sha }}
          path: |
            .local/p0/gametest/p0-control/server-checks.json
            .local/p0/gametest/p0-control/living-checks.json
            .local/p0/gametest/p0-control/family-checks.json
            .local/p0/gametest/p0-control/core-checks.json
            .local/p0/gametest/p0-control/filling-checks.json
          if-no-files-found: warn
      - name: Upload development jar
        uses: actions/upload-artifact@v4
        with:
          name: mcyukkuri-${{ matrix.os }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
