name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The mod build only reads src/ and the Gradle wrapper; skip the large art trees.
          sparse-checkout: |
            src
            gradle
            scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: ./gradlew build --no-daemon
      - name: Upload development jar
        uses: actions/upload-artifact@v4
        with:
          name: mcyukkuri-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Package small local runtime
        run: python3 scripts/package_ci_runtime.py --jar build/libs --output build/ci-runtime --commit "$GITHUB_SHA"
      - name: Upload compiled runtime and resource hashes
        uses: actions/upload-artifact@v4
        with:
          name: mcyukkuri-runtime-${{ github.sha }}
          path: build/ci-runtime/
          if-no-files-found: error
