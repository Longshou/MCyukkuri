name: 功能任务
description: 记录一个生态、美术或工程目标
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: 玩家能观察到的结果
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Wiki 与参考来源
      description: 附本库 Wiki 路径；原创设计请标明，不混合作品设定。
  - type: textarea
    id: acceptance
    attributes:
      label: 完成标准（可选）
      description: 怎样算做完，例如进游戏能看到什么。
