allprojects { layout.buildDirectory.set(file('.local/deibu-life-design/build')) }
gradle.projectsEvaluated {
    rootProject.sourceSets.each { source ->
        def classes = rootProject.layout.buildDirectory.dir("classes/java/${source.name}")
        def resources = rootProject.layout.buildDirectory.dir("resources/${source.name}")
        rootProject.tasks.named(source.compileJavaTaskName) { destinationDirectory.set(classes) }
        rootProject.tasks.named(source.processResourcesTaskName) { destinationDir = resources.get().asFile }
        source.output.classesDirs.setFrom(classes)
        source.output.resourcesDir = resources.get().asFile
    }
    def run = rootProject.neoForge.runs.getByName('p0GameTest')
    run.gameDirectory = rootProject.file('.local/deibu-life-design/gametest')
    run.systemProperty 'mcyukkuri.p0.suite', 'growth'
    rootProject.tasks.register('verifyGrowthOutputs') {
        doLast {
            rootProject.sourceSets.each { source ->
                def actual = rootProject.tasks.named(source.compileJavaTaskName).get().destinationDirectory.get().asFile
                assert actual.toPath().startsWith(rootProject.layout.buildDirectory.get().asFile.toPath())
                assert source.output.classesDirs.files == [actual] as Set
                println "${source.name}: classes=${actual}; resources=${source.output.resourcesDir}"
            }
        }
    }
}
