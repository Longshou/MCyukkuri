// Keep actual source-set output and generated launch classpaths in this task's directory.
gradle.beforeProject { p -> p.layout.buildDirectory.set(p.file('.local/ecology/build')) }
gradle.projectsEvaluated {
    rootProject.allprojects { p ->
        p.sourceSets.each { s ->
            def classes = p.layout.buildDirectory.dir("classes/java/${s.name}")
            def resources = p.layout.buildDirectory.dir("resources/${s.name}")
            p.tasks.named(s.compileJavaTaskName).configure { destinationDirectory.set(classes) }
            s.output.classesDirs.setFrom(classes)
            s.output.resourcesDir = resources.get().asFile
            p.tasks.named(s.processResourcesTaskName).configure { destinationDir = resources.get().asFile }
            println "ECOLOGY_OUTPUT ${s.name}: classes=${s.output.classesDirs.asPath}; resources=${s.output.resourcesDir}"
            println "ECOLOGY_CLASSPATH ${s.name}: ${s.runtimeClasspath.asPath}"
        }
    }
}
