// Isolate actual source-set outputs as well as Gradle project execution history.
allprojects { layout.buildDirectory.set(file('.local/badges/build')) }
gradle.projectsEvaluated {
    rootProject.sourceSets.each { source ->
        def target = rootProject.layout.buildDirectory.dir("classes/java/${source.name}")
        rootProject.tasks.named(source.compileJavaTaskName) { destinationDirectory.set(target) }
        source.output.classesDirs.setFrom(target)
    }
    rootProject.neoForge.runs.getByName('p0GameTest').gameDirectory = rootProject.file('.local/badges/gametest')
    rootProject.neoForge.runs.getByName('p0Preview').gameDirectory = rootProject.file('.local/badges/preview')
}
