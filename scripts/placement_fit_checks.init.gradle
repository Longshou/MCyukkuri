// Isolate actual compiler/resource outputs for the placement-fit checks and write the
// main runtime classpath that scripts/verify_puff_java.cjs needs (PUFF_CLASSPATH).
gradle.beforeProject { p -> p.layout.buildDirectory.set(p.file('.local/placement-fit/build')) }
gradle.projectsEvaluated {
    rootProject.allprojects { p ->
        p.sourceSets.each { s ->
            def classes = p.layout.buildDirectory.dir("classes/java/${s.name}")
            def resources = p.layout.buildDirectory.dir("resources/${s.name}")
            p.tasks.named(s.compileJavaTaskName).configure { destinationDirectory.set(classes) }
            s.output.classesDirs.setFrom(classes)
            s.output.resourcesDir = resources.get().asFile
            p.tasks.named(s.processResourcesTaskName).configure { destinationDir = resources.get().asFile }
            println "PLACEMENT_FIT_OUTPUT ${s.name}: classes=${s.output.classesDirs.asPath}; resources=${s.output.resourcesDir}"
        }
        p.tasks.register('writePlacementFitClasspath') {
            doLast { p.file('.local/placement-fit/classpath.txt').text = p.sourceSets.main.runtimeClasspath.asPath }
        }
    }
}
