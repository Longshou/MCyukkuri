allprojects {
    layout.buildDirectory.set(file('.local/subspecies-port/build'))
}
gradle.projectsEvaluated {
    rootProject.sourceSets.each { source ->
        def destination = rootProject.layout.buildDirectory.dir("classes/java/${source.name}")
        rootProject.tasks.named(source.compileJavaTaskName) { destinationDirectory.set(destination) }
        source.output.classesDirs.setFrom(destination)
        def resources = rootProject.layout.buildDirectory.dir("resources/${source.name}")
        rootProject.tasks.named(source.processResourcesTaskName) { destinationDir = resources.get().asFile }
        source.output.resourcesDir = resources.get().asFile
    }
    def run = rootProject.neoForge.runs.getByName('p0GameTest')
    run.gameDirectory = rootProject.file('.local/subspecies-port/gametest')
    run.systemProperty 'mcyukkuri.p0.suite', 'subspecies'
    def preview = rootProject.neoForge.runs.getByName('p0Preview')
    preview.gameDirectory = rootProject.file('.local/subspecies-port/preview')
}
