<style>
*{box-sizing:border-box}body{margin:0;background:#eae7de;color:#393540;font-family:"Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto;padding:28px 32px}header{display:flex;justify-content:space-between;gap:20px}h1{font-size:26px;margin:6px 0 10px}p{font-size:13px;color:#71695e;line-height:1.8;margin:0}.badge{font:11px monospace;color:#817260;letter-spacing:.12em}#stage{position:relative;height:550px;max-height:65vh;min-height:320px}canvas{width:100%;height:100%;position:absolute;touch-action:none;cursor:grab}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}button,a{font:13px "Microsoft YaHei",sans-serif;color:#524a41;border:1px solid #cfc7ba;border-radius:8px;background:#f5f1e8;padding:9px 14px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#fffaf0}button.active{background:#4b453f;color:#fff7e6}label{font-size:13px;display:flex;align-items:center;gap:8px}#phase{width:min(340px,48vw);accent-color:#806547}#status{text-align:center;min-height:24px;font-size:15px;color:#65513e}footer{display:flex;justify-content:space-between;gap:20px;align-items:center;border-top:1px solid #d0c8ba;padding-top:18px;margin-top:26px}.shadow{position:absolute;width:150px;height:18px;border-radius:50%;background:#67543b;opacity:.12;filter:blur(10px);pointer-events:none}#error{position:absolute;inset:40% 10%;text-align:center;color:#995441}@media(max-width:650px){main{padding:20px 14px}header,footer{display:block}header p{margin-top:8px}#stage{height:400px}footer .controls{justify-content:flex-start}button,a{padding:8px 11px}}

<main><header><div><div class="badge">YUKKURI / MARISA ANIMATION</div><h1>魔理沙 · 排嗯嗯</h1><p>拖动旋转 · 滚轮缩放 · 双击复位</p></div><p>压低身体、翘起后臀 → 用力排出 → 落地、放松<br>6.4 秒完整动作 · 可暂停检查每个阶段</p></header>
