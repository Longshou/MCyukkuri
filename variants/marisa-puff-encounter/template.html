<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔理沙 · 噗咕较量</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eae7de;color:#51463e;font:16px system-ui}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:26px;margin-bottom:8px}p{line-height:1.7}.stage{position:relative;border-radius:16px;background:linear-gradient(#eae7de 80%,#ddd8cb);overflow:hidden}canvas{display:block;width:100%;height:460px}.actors{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}.card{border:1px solid #c8bdac;border-radius:10px;padding:14px}.card h2{font-size:18px;margin:0 0 10px}.card input{width:100%;accent-color:#857258}.state{font-size:14px;min-height:22px}button{padding:9px 16px;background:#fff6e5;border:1px solid #b7a991;border-radius:8px;color:#51463e;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#timeline{flex:1;min-width:150px;accent-color:#857258}#caption{text-align:center;min-height:28px;font-size:19px;margin:12px}.note{font-size:13px;color:#786d60}@media(max-width:650px){main{padding:14px}canvas{height:320px}.actors{gap:10px}.card{padding:10px}}</style>
<main><h1>魔理沙 · 噗咕较量</h1><p>同样的魔理沙，也有不同的鼓腮本领。噗咕较弱的一只会被吓到，泄气后转身逃跑。</p>
<div class="stage"><canvas id="view" aria-label="两只魔理沙鼓腮较量的动画"></canvas></div><div id="caption" aria-live="polite">正在准备…</div>
<div class="controls"><button id="play">暂停</button><button id="replay">再来一次</button><button id="swap">交换强弱</button><input id="timeline" aria-label="动画进度" type="range" min="0" max="7" step=".02" value="0"></div>
<div class="actors"><section class="card"><h2>左边的魔理沙</h2><label>鼓腮幅度 <output id="value0">125%</output><input id="strength0" type="range" min=".55" max="1.35" step=".05" value="1.25"></label><div class="state" id="state0"></div></section><section class="card"><h2>右边的魔理沙</h2><label>鼓腮幅度 <output id="value1">80%</output><input id="strength1" type="range" min=".55" max="1.35" step=".05" value=".8"></label><div class="state" id="state1"></div></section></div>
<p class="note">差距很小时，双方都不会逃跑。沿用 A 的完整闭眼线与贴脸泄气动作。此页为模型互动预览，尚未接入 Minecraft 实体 AI。</p></main>
<script>__RUNTIME__
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),textures={},strengths=[1.25,.8];let time=0,playing=true,last=0,ready=false,dirty=true;
const sliders=[0,1].map(i=>document.getElementById('strength'+i));
function sync(){document.getElementById('play').textContent=playing?'暂停':'播放';for(let i=0;i<2;i++){sliders[i].value=strengths[i];document.getElementById('value'+i).value=Math.round(strengths[i]*100)+'%';}document.getElementById('timeline').value=time;}
function restart(){time=0;playing=true;dirty=true;sync();}
sliders.forEach((s,i)=>s.oninput=()=>{strengths[i]=Number(s.value);restart();});
document.getElementById('swap').onclick=()=>{strengths.reverse();restart();};document.getElementById('replay').onclick=restart;
document.getElementById('play').onclick=()=>{if(time>=7)time=0;playing=!playing;sync();};document.getElementById('timeline').oninput=e=>{time=Number(e.target.value);playing=false;dirty=true;sync();};
Promise.all(Object.entries(DATA.textures).map(([k,src])=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.drawImage(im,0,0);textures[k]=x.getImageData(0,0,128,128).data;res();};im.onerror=rej;im.src=src;}))).then(()=>{ready=true;last=0;}).catch(()=>document.getElementById('caption').textContent='贴图加载失败，请重新打开。');
function frame(now){const dt=last?(now-last)/1000:0;last=now;if(ready&&playing){time=Math.min(7,time+dt);dirty=true;if(time>=7)playing=false;sync();}const w=Math.min(960,Math.round(canvas.clientWidth)),h=Math.round(canvas.clientHeight);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true;}if(ready&&dirty){const scene=encounter(time,strengths),vs=scene.actors.flatMap(a=>a.vertices),span=Math.max(12,21*h/w),pixels=renderEncounter(vs,scene.actors.map(a=>textures[a.texture]),w,h,0,.06,span);ctx.clearRect(0,0,w,h);ctx.putImageData(new ImageData(pixels,w,h),0,0);scene.actors.forEach((a,i)=>document.getElementById('state'+i).textContent=a.state);document.getElementById('caption').textContent=!scene.triggered?(time<1.95?'噗——咕！': '谁也不肯认输。'):(time<2.65?'呀！你的怎么这么大？！':time<4.5?'不比了！快跑！':'这次噗咕较量结束了。');dirty=false;}requestAnimationFrame(frame);}
window.encounterDebug={setTime(t){time=t;playing=false;dirty=true;sync();},state:()=>({time,playing,strengths:[...strengths],...encounter(time,strengths)}),ready:()=>ready};document.addEventListener('visibilitychange',()=>last=0);requestAnimationFrame(frame);
</script></html>
