<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔理沙 · 躯干长度</title><style>*{box-sizing:border-box}body{margin:0;background:#eae7de;color:#51463e;font:16px system-ui}main{max-width:1180px;margin:auto;padding:24px}h1{font-size:26px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid #c7bcaa;border-radius:10px;overflow:hidden;background:#eeeade}.card img{width:100%;display:block}.card button{margin:8px;font-size:13px}.card.active{border:2px solid #665943}button,a{color:#51463e}button{padding:9px 12px;border:1px solid #b7a98e;border-radius:7px;background:#fff7e6;cursor:pointer}#view{width:100%;height:470px;display:block;background:linear-gradient(#eae7de 84%,#d8d2c5);border-radius:14px;margin:18px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#phase{flex:1;min-width:180px}p{line-height:1.6}.note{font-size:13px;color:#7b705f}#selected{font-size:20px;margin-top:20px}@media(max-width:700px){main{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}#view{height:380px}}</style><main><h1>魔理沙 · 躯干加长 / 油臀原大小</h1><p>用同一段受惊、转身和逃跑动作比较四档躯干长度。镜头跟随角色，固定缩放，体型差异会直接显示。</p><div class="cards" id="cards"></div><div id="selected"></div><canvas id="view" aria-label="魔理沙逃跑比例预览"></canvas><div class="controls"><button id="play">暂停</button><button id="replay">重新受惊逃跑</button><input type="range" id="phase" min="0" max="5" step=".02" value="1.5" aria-label="动作进度"><label><input id="loop" type="checkbox" checked>循环观察</label></div><div class="controls" style="margin-top:12px"><button data-angle="2.3">后侧看油臀</button><button data-angle="1.57">侧面</button><button data-angle="3.14159">背面</button><button data-angle="0">正面</button><a id="download" download>下载此版模型</a></div><p class="note">这轮加长脸到臀部之间的主体，油臀保持原宽、高、深，只整体向后移。侧发、后发和帽子后部随主体延展；前脸与身高不变。A 为原版，B/C/D 躯干纵深增加 25% / 50% / 75%。上一轮拉长油臀的试验已撤出当前比较。</p></main><script>__RUNTIME__
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');let active='c',t=1.5,angle=1.57,playing=true,last=0,ready=false,texture,dirty=true;
for(const v of DATA.variants){const card=document.createElement('div');card.className='card';card.dataset.id=v.id;card.innerHTML='<img src="'+v.id+'/preview.png" alt="'+v.label+'"><button>'+v.label+'</button>';card.querySelector('button').onclick=()=>{active=v.id;dirty=true;sync();};document.getElementById('cards').append(card);}
function sync(){const v=DATA.variants.find(x=>x.id===active);document.getElementById('selected').textContent=v.label+' · 前脸与身高不变 · 躯干纵深 '+Math.round(v.depth*100)+'%';document.getElementById('download').href=active+'/marisa.bbmodel';document.getElementById('play').textContent=playing?'暂停':'播放';document.getElementById('phase').value=t;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.id===active));}
document.getElementById('play').onclick=()=>{if(t>=5)t=0;playing=!playing;sync();};document.getElementById('replay').onclick=()=>{t=0;playing=true;dirty=true;sync();};document.getElementById('phase').oninput=e=>{t=Number(e.target.value);playing=false;dirty=true;sync();};document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=Number(b.dataset.angle);dirty=true;});
const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.drawImage(im,0,0);texture=x.getImageData(0,0,128,128).data;ready=true;last=0;};im.src=DATA.textures.surprise;
function frame(now){const dt=last?(now-last)/1000:0;last=now;if(playing&&ready){t+=dt;if(t>=5){if(document.getElementById('loop').checked)t=1+(t-5);else{t=5;playing=false;}}dirty=true;sync();}const w=Math.min(900,Math.round(canvas.clientWidth)),h=Math.round(canvas.clientHeight);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true;}if(ready&&dirty){const p=fleePose(active,t,angle);ctx.putImageData(new ImageData(renderModel(p.vertices,texture,w,h,0,.12,Math.max(14.5,12*h/w)),w,h),0,0);dirty=false;}requestAnimationFrame(frame);}
window.trialsDebug={ready:()=>ready,set(id,time,a=2.3){active=id;t=time;angle=a;playing=false;dirty=true;sync();},state:()=>({active,t,angle,playing})};document.addEventListener('visibilitychange',()=>last=0);sync();requestAnimationFrame(frame);
</script></html>
