document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{activeClip=b.dataset.clip;motionTime=0;enabled=true;walking=true;travel=false;phase.max=DATA.rig.clips[activeClip].duration;phase.value=0;document.getElementById('travel').disabled=activeClip!=='waddle';document.getElementById('travel').setAttribute('aria-pressed','false');document.querySelectorAll('[data-clip]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});syncWalk();dirty=true;});
phase.oninput=()=>{walking=false;enabled=true;motionTime=Number(phase.value);syncWalk();dirty=true;};
window.waddleDebug={setTime(t){walking=false;enabled=true;motionTime=t;phase.value=t;syncWalk();dirty=true;},vertices(){return poseVertices(DATA.vertices,DATA.rig,motionTime,enabled,travel,activeClip);},state(){return {walking,enabled,travel,motionTime,activeClip};}};
function reset(){az=-.55;el=.15;span=16;motionTime=0;travel=false;document.getElementById('travel').setAttribute('aria-pressed','false');dirty=true;}
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag[0])*.008;el=Math.max(-.55,Math.min(1.25,el+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];dirty=true;});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>drag=null);

canvas.addEventListener('dblclick',reset);document.getElementById('reset').onclick=reset;
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{az=Number(b.dataset.angle)*Math.PI/180;el=Number(b.dataset.angle)===0?0:.2;dirty=true;});
document.getElementById('auto').onclick=e=>{auto=!auto;e.target.classList.toggle('active',auto);e.target.setAttribute('aria-pressed',String(auto));e.target.textContent=auto?'暂停旋转':'自动旋转';};
function frame(t){if(failed)return;try{
  const dt=Math.min((t-last)/1000,.05);last=t;if(walking){motionTime+=dt;const clip=DATA.rig.clips[activeClip];if(!clip.loop&&motionTime>=clip.duration){motionTime=clip.duration;walking=false;syncWalk();}phase.value=clip.loop?motionTime%clip.duration:motionTime;dirty=true;}if(auto&&!drag){az+=dt*.35;dirty=true;}

  if(cw&&ch){const ratio=Math.min(1,720/cw,640/ch),w=Math.max(1,Math.round(cw*ratio)),h=Math.max(1,Math.round(ch*ratio));

  }

requestAnimationFrame(frame);
}catch(e){fail(e);}
