phase.oninput=()=>{walking=false;enabled=true;motionTime=Number(phase.value);syncWalk();dirty=true;};
window.waddleDebug={setTime(t){walking=false;enabled=true;motionTime=t;phase.value=t;syncWalk();dirty=true;},vertices(){return poseVertices(DATA.vertices,DATA.rig,motionTime,enabled,travel);},state(){return {walking,enabled,travel,motionTime};}};
function reset(){az=-.75;el=.22;span=13.5;motionTime=0;travel=false;document.getElementById('travel').setAttribute('aria-pressed','false');dirty=true;}
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag[0])*.008;el=Math.max(-.55,Math.min(1.25,el+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];dirty=true;});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();span=Math.max(11,Math.min(24,span*Math.exp(e.deltaY*.001)));dirty=true;},{passive:false});
canvas.addEventListener('dblclick',reset);document.getElementById('reset').onclick=reset;
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{az=Number(b.dataset.angle)*Math.PI/180;el=Number(b.dataset.angle)===0?0:.2;dirty=true;});
document.getElementById('auto').onclick=e=>{auto=!auto;e.target.classList.toggle('active',auto);e.target.setAttribute('aria-pressed',String(auto));e.target.textContent=auto?'暂停旋转':'自动旋转';};
function frame(t){if(failed)return;try{
  const dt=Math.min((t-last)/1000,.05);last=t;if(walking){motionTime+=dt;phase.value=motionTime%DATA.rig.duration;dirty=true;}if(auto&&!drag){az+=dt*.35;dirty=true;}
  const cw=canvas.clientWidth,ch=canvas.clientHeight;
  if(cw&&ch){const ratio=Math.min(1,720/cw,640/ch),w=Math.max(1,Math.round(cw*ratio)),h=Math.max(1,Math.round(ch*ratio));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true;}
    if(texture&&dirty){const effectiveSpan=Math.max(span,11*h/w);const shadow=document.querySelector('.shadow');const tz=travel?travelOffset(DATA.rig,motionTime):0;shadow.style.top=(50+(8.8*Math.cos(el)-tz*Math.cos(az)*Math.sin(el))/(2*effectiveSpan)*100)+'%';shadow.style.bottom='auto';shadow.style.transform='translateY(-50%)';shadow.style.width=(12*h/(2*effectiveSpan*w)*100)+'%';shadow.style.left=(50+(tz*Math.sin(az)-6)*h/(2*effectiveSpan*w)*100)+'%';const data=ctx.createImageData(w,h);data.data.set(renderModel(poseVertices(DATA.vertices,DATA.rig,motionTime,enabled,travel),texture,w,h,az,el,effectiveSpan));ctx.putImageData(data,0,0);fallback.style.display='none';dirty=false;}
  }
  requestAnimationFrame(frame);
}catch(e){fail(e);}}
requestAnimationFrame(frame);
}catch(e){fail(e);}
}
