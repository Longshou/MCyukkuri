<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔理沙 · B 动作预览</title><style>*{box-sizing:border-box}body{margin:0;background:#eae7de;color:#51463e;font:16px system-ui}main{max-width:1140px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 10px}p{line-height:1.6}.stage{background:linear-gradient(#eae7de 87%,#dcd6c8);border-radius:14px;overflow:hidden}canvas{width:100%;height:540px;display:block;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}button,a{color:#51463e}button{background:#fff6e4;border:1px solid #b8aa91;border-radius:8px;padding:10px 16px;cursor:pointer}button.active{background:#625641;color:white}#phase{flex:1;min-width:160px;accent-color:#857258}.note{font-size:13px;color:#796f60}#status{min-width:130px}footer{margin-top:20px}@media(max-width:650px){main{padding:14px}canvas{height:410px}button{padding:8px 12px}}</style>
<main><h1>魔理沙 · B 体型动作预览</h1><p>拖动可随时旋转视角，滚轮缩放；触屏单指旋转、双指缩放。播放和暂停时都能调整角度。</p><div class="controls"><button data-clip="puff" class="active">噗咕</button><button data-clip="stretch">伸长</button><button data-clip="flee">受惊逃跑</button></div><div class="stage"><canvas id="view" aria-label="可自由旋转的魔理沙动画预览"></canvas></div><div class="controls"><button id="play">暂停</button><button id="replay">从头播放</button><label><input type="checkbox" id="loop" checked>循环</label><input id="phase" type="range" min="0" max="6.4" step=".02" value="0" aria-label="动作进度"><span id="status">载入中…</span></div><div class="controls"><button data-view="0">正面</button><button data-view="1.5708">侧面</button><button data-view="3.14159">背面</button><button data-view="2.3">后侧看油臀</button><button id="reset-camera">重置视角</button></div><footer><a href="marisa.bbmodel" download>下载此体型模型</a><p class="note">B 躯干长度、整体增高 6%；逃跑已取消油臀前后拉伸并收小扭动。切换动作保持当前视角。逃跑使用跟随观察方式，尚未接入 MC 实体 AI。</p></footer></main>
<script>__RUNTIME__
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),textures={},model=DATA.models.b,durations={puff:6.4,stretch:2.8,flee:5};let clip='puff',time=0,az=-.45,el=.14,span=14.5,playing=true,last=0,dirty=true,ready=false;
const phase=document.getElementById('phase'),play=document.getElementById('play'),pointers=new Map();
function sync(){play.textContent=playing?'暂停':'播放';play.setAttribute('aria-pressed',String(playing));phase.max=durations[clip];phase.value=time;document.getElementById('status').textContent=time.toFixed(2)+' / '+durations[clip].toFixed(2)+' 秒';document.querySelectorAll('[data-clip]').forEach(b=>{b.classList.toggle('active',b.dataset.clip===clip);b.setAttribute('aria-pressed',String(b.dataset.clip===clip));});}
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{clip=b.dataset.clip;time=0;playing=true;dirty=true;sync();});
play.onclick=()=>{if(time>=durations[clip])time=0;playing=!playing;dirty=true;sync();};document.getElementById('replay').onclick=()=>{time=0;playing=true;dirty=true;sync();};phase.oninput=e=>{time=Number(e.target.value);playing=false;dirty=true;sync();};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{az=Number(b.dataset.view);el=.12;dirty=true;});document.getElementById('reset-camera').onclick=()=>{az=-.45;el=.14;span=14.5;dirty=true;};
function distance(){const p=[...pointers.values()];return p.length===2?Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]):0;}
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),before=distance();pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){az-=(e.clientX-old[0])*.009;el=Math.max(-.6,Math.min(1.2,el+(e.clientY-old[1])*.009));}else if(before>0){const after=distance();if(after>0)span=Math.max(10,Math.min(25,span*before/after));}dirty=true;});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>{pointers.delete(e.pointerId);if(!pointers.size)canvas.classList.remove('dragging');});
canvas.addEventListener('wheel',e=>{e.preventDefault();span=Math.max(10,Math.min(25,span*Math.exp(e.deltaY*.001)));dirty=true;},{passive:false});
Promise.all(Object.entries(DATA.textures).map(([k,src])=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.drawImage(im,0,0);textures[k]=x.getImageData(0,0,128,128).data;res();};im.onerror=rej;im.src=src;}))).then(()=>{ready=true;last=0;dirty=true;}).catch(()=>document.getElementById('status').textContent='贴图加载失败');
function frame(now){const dt=last?(now-last)/1000:0;last=now;if(playing&&ready){time+=dt;if(time>=durations[clip]){if(document.getElementById('loop').checked)time%=durations[clip];else{time=durations[clip];playing=false;}}dirty=true;sync();}const w=Math.min(960,Math.round(canvas.clientWidth)),h=Math.round(canvas.clientHeight);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true;}if(ready&&dirty){const v=clip==='flee'?fleePose('b',time,-Math.PI/2).vertices:poseVertices(model.vertices,model.rig,time,true,false,clip);const tex=textures[clip==='flee'?'surprise':'neutral'];ctx.putImageData(new ImageData(renderModel(v,tex,w,h,az,el,Math.max(span,13*h/w)),w,h),0,0);dirty=false;}requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>last=0);window.actionsDebug={ready:()=>ready,state:()=>({clip,time,az,el,span,playing}),setTime(t){time=t;playing=false;dirty=true;sync();}};sync();requestAnimationFrame(frame);
</script></html>
