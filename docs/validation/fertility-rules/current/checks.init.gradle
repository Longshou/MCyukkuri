// Joint acceptance: isolate actual classes, resources, launch files and execution history.
allprojects { layout.buildDirectory.set(file('.local/fertility-rules/build')) }
gradle.projectsEvaluated {
    def project = rootProject
    project.sourceSets.each { source ->
        def classes = project.layout.buildDirectory.dir("classes/java/${source.name}")
        def resources = project.layout.buildDirectory.dir("resources/${source.name}")
        project.tasks.named(source.compileJavaTaskName) { destinationDirectory.set(classes) }
        project.tasks.named(source.processResourcesTaskName) { destinationDir = resources.get().asFile }
        source.output.classesDirs.setFrom(classes)
        source.output.resourcesDir = resources.get().asFile
    }
    def names = [p0GameTest:'gametest', p0Server:'server', p0ClientA:'client-a', p0ClientB:'client-b', p0Preview:'preview']
    names.each { name, directory ->
        def run = project.neoForge.runs.getByName(name)
        run.gameDirectory = project.file(".local/fertility-rules/${directory}")
        run.systemProperty 'mcyukkuri.p0.suite', 'consumables'
        if (name in ['p0ClientA', 'p0ClientB']) {
            run.programArguments.set(run.programArguments.get().collect { it == '127.0.0.1:25586' ? '127.0.0.1:25619' : it })
        }
    }
    project.tasks.register('integrationIsolation') {
        doLast {
            def result = [:]
            project.sourceSets.each { source ->
                def paths = [classes:source.output.classesDirs.files*.absolutePath,
                             resources:[source.output.resourcesDir.absolutePath],
                             runtime:source.runtimeClasspath.files*.absolutePath]
                paths.values().flatten().each { path ->
                    if (path.replace('\\','/').startsWith(project.file('build').absolutePath.replace('\\','/') + '/'))
                        throw new GradleException("Root build leaked into ${source.name}: ${path}")
                }
                result[source.name] = paths
            }
            def out = project.file('.local/fertility-rules/isolation.json')
            out.parentFile.mkdirs()
            out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result))
            println "ISOLATION VERIFIED: ${out}"
        }
    }
}

