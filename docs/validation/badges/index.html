<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>金银章实机预览</title><style>body{margin:0;background:#f4ead5;color:#334740;font:16px/1.7 system-ui}main{max-width:1280px;margin:auto;padding:28px}h1{font-size:30px;margin:0}button,a{color:inherit}button{padding:7px 14px;margin:3px;background:#fff9e9;border:1px solid #718477;border-radius:5px;cursor:pointer}nav{position:sticky;top:0;padding:10px;background:#f4ead5;z-index:2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:16px}figure{margin:0;background:#fff9e9;border:1px solid #c6c8b0;border-radius:8px;overflow:hidden}figcaption{padding:9px 14px}img{width:100%;display:block}details{margin:18px 0}summary{cursor:pointer;font-size:21px}a{text-decoration:underline}p{max-width:1000px}</style><main><h1>金银章实机预览</h1><p>圆牌挂在角色饰物表面。七种原有角色与两种首轮捕食种分别采集正面、饰物斜侧、饰物侧面、背面；下方保留动作、幼体、离身和菜单证据。造型尚待用户确认。<a href="README.md">验收范围</a> · <a href="../../BADGES.md">玩法说明</a> · <a href="../../../wiki/badges.md">漫画与小说依据</a></p><nav><button onclick="setView('front')">正面</button><button onclick="setView('mount-oblique')">斜侧</button><button onclick="setView('mount-side')">侧面</button><button onclick="setView('back')">背面</button></nav><div class="grid" id="characters"></div><details open><summary>离身饰物仍有圆牌</summary><p>七种均使用实际饰物物品渲染。新增两种捕食种由其最新完整客户端补采，已在本任务逐张目视核对。</p><div class="grid"><figure><a href="images/detached-reimu.png"><img src="images/detached-reimu.png"></a><figcaption>灵梦</figcaption></figure><figure><a href="images/detached-marisa.png"><img src="images/detached-marisa.png"></a><figcaption>魔理沙</figcaption></figure><figure><a href="images/detached-chen.png"><img src="images/detached-chen.png"></a><figcaption>橙</figcaption></figure><figure><a href="images/detached-alice.png"><img src="images/detached-alice.png"></a><figcaption>爱丽丝</figcaption></figure><figure><a href="images/detached-patchouli.png"><img src="images/detached-patchouli.png"></a><figcaption>帕秋莉</figcaption></figure><figure><a href="images/detached-remilia.png"><img src="images/detached-remilia.png"></a><figcaption>蕾米莉亚 · 最新客户端补验</figcaption></figure><figure><a href="images/detached-flandre.png"><img src="images/detached-flandre.png"></a><figcaption>弗兰 · 最新客户端补验</figcaption></figure></div></details><details><summary>伸展过程中的挂接</summary><div class="grid"><figure><img loading="lazy" src="images/reimu-stretch-0.png"><figcaption>灵梦 · 帧 0</figcaption></figure><figure><img loading="lazy" src="images/reimu-stretch-4.png"><figcaption>灵梦 · 帧 4</figcaption></figure><figure><img loading="lazy" src="images/reimu-stretch-8.png"><figcaption>灵梦 · 帧 8</figcaption></figure><figure><img loading="lazy" src="images/marisa-stretch-0.png"><figcaption>魔理沙 · 帧 0</figcaption></figure><figure><img loading="lazy" src="images/marisa-stretch-4.png"><figcaption>魔理沙 · 帧 4</figcaption></figure><figure><img loading="lazy" src="images/marisa-stretch-8.png"><figcaption>魔理沙 · 帧 8</figcaption></figure><figure><img loading="lazy" src="images/alice-stretch-0.png"><figcaption>爱丽丝 · 帧 0</figcaption></figure><figure><img loading="lazy" src="images/alice-stretch-4.png"><figcaption>爱丽丝 · 帧 4</figcaption></figure><figure><img loading="lazy" src="images/alice-stretch-8.png"><figcaption>爱丽丝 · 帧 8</figcaption></figure><figure><img loading="lazy" src="images/remilia-stretch-0.png"><figcaption>蕾米莉亚 · 帧 0</figcaption></figure><figure><img loading="lazy" src="images/remilia-stretch-4.png"><figcaption>蕾米莉亚 · 帧 4</figcaption></figure><figure><img loading="lazy" src="images/remilia-stretch-8.png"><figcaption>蕾米莉亚 · 帧 8</figcaption></figure><figure><img loading="lazy" src="images/flandre-stretch-0.png"><figcaption>弗兰 · 帧 0</figcaption></figure><figure><img loading="lazy" src="images/flandre-stretch-4.png"><figcaption>弗兰 · 帧 4</figcaption></figure><figure><img loading="lazy" src="images/flandre-stretch-8.png"><figcaption>弗兰 · 帧 8</figcaption></figure></div></details><details><summary>幼体与饰物离身</summary><div class="grid"><figure><img src="images/juvenile.png"><figcaption>幼体缩放 0.4，徽章随整体缩放</figcaption></figure><figure><img src="images/bare.png"><figcaption>饰物离身后不显示徽章</figcaption></figure></div></details><details open><summary>实际档案与考核菜单</summary><img src="images/menu.png"></details><script>const records=[{"id": "reimu", "name": "灵梦", "view": "mount-oblique"}, {"id": "marisa", "name": "魔理沙", "view": "mount-side"}, {"id": "house_reimu", "name": "家灵梦", "view": "mount-oblique"}, {"id": "house_marisa", "name": "家魔理沙", "view": "mount-side"}, {"id": "chen", "name": "橙", "view": "mount-oblique"}, {"id": "alice", "name": "爱丽丝", "view": "mount-oblique"}, {"id": "patchouli", "name": "帕秋莉", "view": "mount-oblique"}, {"id": "remilia", "name": "蕾米莉亚", "view": "mount-oblique"}, {"id": "flandre", "name": "弗兰", "view": "mount-oblique"}];const grid=document.querySelector('#characters');for(const r of records){const f=document.createElement('figure');f.innerHTML=`<a href="images/${r.id}-${r.view}.png"><img data-id="${r.id}" src="images/${r.id}-${r.view}.png"></a><figcaption>${r.name}</figcaption>`;grid.append(f)}function setView(v){for(const im of grid.querySelectorAll('img')){im.src=`images/${im.dataset.id}-${v}.png`;im.parentNode.href=im.src}}</script></main></html>
