<h1>当前共同版本 · 实机验收图集</h1>
<p><strong>历史版本：</strong>豆体母体受孕和分娩不符合 2026-09-13 更正的设定：不足油除多毛外均不可生育，DOS 也不可生育。以下图像与旧检查数仅保留为历史证据，最新修正见<a href="../../fertility-rules/README.md">生育资格验收</a>。</p>
<p>旧固定产物的 36 项 GameTest、四批实机 2631 条检查当时通过。以下 12 张原始帧包含两个客户端的联合验收和单客户端豆体补拍，点击可看原图。</p>
<p><a href="../README.md">完整验收说明</a> · <a href="summary.json">结果与 Jar 指纹</a> · <a href="visual-review.json">逐图记录</a></p>
<p class="note">剪茎使用真实两胎受孕与实际剪切，进度固定在完整视觉尺寸但尚未成熟处。技术画面复核不替代用户对标准造型的确认。</p>
