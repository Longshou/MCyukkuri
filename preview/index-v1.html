<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>油库里 · 普通种模型预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ebe9e2;color:#34382f;font-family:'Microsoft YaHei',sans-serif}header{position:absolute;top:35px;left:4%;right:4%;display:flex;justify-content:space-between;pointer-events:none}h1{font-size:28px;letter-spacing:3px;margin:7px 0 9px;font-weight:600}.eyebrow{font-size:11px;letter-spacing:3px;color:#7b806e}.desc{font-size:12px;color:#787c6e;line-height:1.8}.badge{align-self:flex-start;border:1px solid #adb29f;padding:9px 14px;border-radius:30px;font-size:11px;letter-spacing:1px}#canvas{width:100vw;height:100vh;display:block;touch-action:none}.labels{position:absolute;bottom:145px;left:0;right:0;display:flex;justify-content:center;gap:23vw;pointer-events:none;text-align:center}.name{font-size:21px;font-weight:600;letter-spacing:4px}.latin{font-size:10px;letter-spacing:3px;color:#929482;margin-top:7px}.tag{font-size:11px;margin-bottom:7px;color:#7e826f}.controls{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#fffc;padding:7px;border-radius:12px;box-shadow:0 4px 28px #464c3110;white-space:nowrap}button{border:0;background:transparent;color:#747a66;border-radius:7px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:12px}button:hover,button.active{background:#525e47;color:white}.hint{position:absolute;bottom:24px;width:100%;text-align:center;color:#929784;font-size:11px;letter-spacing:1px}.corner{position:absolute;right:4%;bottom:28px;font-size:10px;color:#a0a493;letter-spacing:1px}@media(max-width:700px){.badge,.corner{display:none}.labels{gap:25vw}.controls{bottom:64px}button{padding:9px}.desc{max-width:230px}h1{font-size:23px}}
.labels{left:8.5%;right:8.5%;gap:0}.labels>div{width:50%}
</style>
<canvas id="canvas"></canvas>
<header><div><div class="eyebrow">YUKKURI / MINECRAFT MODEL STUDY</div><h1>ゆっくりしていってね！</h1><div class="desc">普通种 · 魔理沙 & 灵梦<br>参考《油库里八景》 · 方块造型 / 原创像素贴图</div></div><span class="badge">01 / 初版造型预览</span></header>
<div class="labels"><div><div class="tag">普通种 · 黑帽与金发</div><div class="name">魔理沙</div><div class="latin">MARISA</div></div><div><div class="tag">普通种 · 红白蝴蝶结</div><div class="name">灵梦</div><div class="latin">REIMU</div></div></div>
<div class="controls"><button data-view="three" class="active">立体</button><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button id="spin">自动旋转</button><button id="wire">线框</button></div>
<div class="hint">拖动旋转 · 滚轮缩放 · 两个模型同步展示</div><div class="corner">16 MODEL UNITS = 1 BLOCK</div>
<script src="vendor/three.min.js"></script><script src="models-v1.js"></script><script>
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
const scene=new THREE.Scene();scene.background=new THREE.Color('#ebe9e2');
const camera=new THREE.OrthographicCamera(-35,35,24,-24,.1,250);camera.position.set(0,34,82);camera.lookAt(0,7,0);
scene.add(new THREE.HemisphereLight(0xfffcf0,0xb1ac98,.95));
const light=new THREE.DirectionalLight(0xfff7e9,.85);light.position.set(-26,50,35);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-45,right:45,top:35,bottom:-35,far:150});light.shadow.bias=-.0005;light.shadow.normalBias=.04;scene.add(light);
const fill=new THREE.DirectionalLight(0xffffff,.25);fill.position.set(30,20,-20);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:'#ebe9e2',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.15;floor.receiveShadow=true;scene.add(floor);
let groups=[],meshes=[],wire=false,spin=false,yaw=-.32,pitch=0,zoom=1;
const colors={skin:'#ffe1b0',skin_shadow:'#efbe87',skin_light:'#ffe8c3',gold:'#edb932',gold_light:'#ffda57',gold_dark:'#c99325',hair:'#382b28',hair_light:'#51403a',hair_dark:'#271e1d',hat:'#292934',hat_light:'#393944',hat_dark:'#20212a',red:'#cb3346',red_light:'#ec5260',red_dark:'#9d253a',white:'#fff4db',white_shadow:'#d8d0c6'};
for(let i=0;i<MODELS.length;i++){
 const model=MODELS[i],g=new THREE.Group();g.position.x=(i-.5)*29;scene.add(g);groups.push(g);
 const disk=new THREE.Mesh(new THREE.CylinderGeometry(12.7,13.0,.65,64),new THREE.MeshStandardMaterial({color:'#dadccf',roughness:1}));disk.position.set(g.position.x,-.65,0);disk.receiveShadow=true;scene.add(disk);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(12.5,.035,4,96),new THREE.MeshBasicMaterial({color:'#a8b195'}));ring.rotation.x=Math.PI/2;ring.position.set(g.position.x,-.30,0);scene.add(ring);
 for(const c of model.cubes){
  const size=c.to.map((v,j)=>v-c.from_[j]); const geo=new THREE.BoxGeometry(...size),mat=new THREE.MeshStandardMaterial({color:colors[c.color],roughness:.95});
  let materials=mat;
  if(c.face){const t=new THREE.TextureLoader().load(model.texture);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.encoding=THREE.sRGBEncoding;t.repeat.set(.5,48/128);t.offset.set(0,1-48/128);materials=[mat,mat,mat,mat,new THREE.MeshStandardMaterial({map:t,roughness:1}),mat];}
  const mesh=new THREE.Mesh(geo,materials);mesh.position.set(...c.to.map((v,j)=>(v+c.from_[j])/2));mesh.rotation.z=c.rotation*Math.PI/180;mesh.castShadow=true;mesh.receiveShadow=true;mesh.name=c.name;g.add(mesh);meshes.push(mesh);
 }
}
scene.background.convertSRGBToLinear();const converted=new Set();scene.traverse(o=>{if(o.material){for(const m of (Array.isArray(o.material)?o.material:[o.material]))if(!converted.has(m)){m.color.convertSRGBToLinear();converted.add(m)}}});
function resize(){let w=innerWidth,h=innerHeight;renderer.setSize(w,h);const span=70/zoom;camera.left=-span/2;camera.right=span/2;camera.top=span*h/w/2;camera.bottom=-span*h/w/2;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
function view(v){yaw=({three:-.32,front:0,side:-Math.PI/2,back:Math.PI})[v];pitch=0;camera.position.set(0,v==='front'?8:34,82);camera.lookAt(0,v==='front'?8:7,0);spin=false;document.querySelector('#spin').classList.remove('active');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelector('#spin').onclick=e=>{spin=!spin;e.target.classList.toggle('active',spin)};
document.querySelector('#wire').onclick=e=>{wire=!wire;e.target.classList.toggle('active',wire);meshes.forEach(m=>(Array.isArray(m.material)?m.material:[m.material]).forEach(a=>a.wireframe=wire))};
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.009;pitch=Math.max(-.5,Math.min(.5,pitch+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY]};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.7,zoom-e.deltaY*.0007));resize()};
const requested=new URLSearchParams(location.search).get('view');if(['front','side','back','three'].includes(requested))view(requested);
let previous=performance.now();function render(now){if(spin)yaw+=(now-previous)*.0003;previous=now;groups.forEach(g=>{g.rotation.y=yaw;g.rotation.x=pitch});renderer.render(scene,camera);requestAnimationFrame(render)}requestAnimationFrame(render);window.previewReady=true;
</script></html>
