<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>油库里 · 素材预览室</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <a class="brand" href="/.local/previews/index.html"><span class="logo">ゆ</span><span>油库里<span class="brand-small">素材预览室</span></span></a>
  <nav aria-label="预览分类"><button class="tab active" data-tab="models">角色与动作</button><button class="tab" data-tab="audio">声音</button></nav>
  <a class="home-link" href="/.local/previews/index.html">返回预览首页</a>
</header>
<main>
<section id="models" class="panel active">
  <aside class="library">
    <div class="section-label">角色与形态 <span id="model-count"></span></div>
    <label class="visually-hidden" for="model-group-filter">形态分类</label><select id="model-group-filter" aria-label="形态分类"><option value="">全部分类</option></select>
    <input id="model-search" type="search" placeholder="搜索角色或形态" aria-label="搜索模型"><div id="model-list"></div>
  </aside>
  <div class="workbench">
    <div class="view-title"><div><span class="eyebrow" id="model-group">普通种</span><h1 id="model-name">灵梦</h1><p id="model-detail">正在读取当前游戏资源…</p></div><div class="view-buttons"><button data-angle="0">正面</button><button data-angle="1.570796">侧面</button><button data-angle="3.141593">背面</button><button data-angle="0.45">三刻</button><button id="reset-view">复位</button></div></div>
    <div id="stage"><canvas id="view" aria-label="可拖动旋转的三维模型"></canvas><div id="loading" role="status">读取模型中…</div><div class="stage-hint">拖动旋转 · 滚轮缩放 · 空格播放 / 暂停</div><div class="stage-tools"><label><input id="grid" type="checkbox" checked>地面</label><label><input id="wire" type="checkbox">线框</label><label><input id="spin" type="checkbox">转台</label></div></div>
    <div class="transport"><button id="play" class="primary" aria-label="播放或暂停动作">播放</button><button id="step-back" title="后退 1/20 秒">−1帧</button><button id="step" title="前进 1/20 秒">+1帧</button><input id="time" type="range" min="0" max="1" step="0.005" value="0" aria-label="动作时间轴"><output id="clock">0.00 / 0.00 秒</output><select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></div>
    <div class="controls"><label>动作<select id="action"></select></label><label>表情<select id="expression"></select></label><label class="check"><input id="loop" type="checkbox" checked>循环播放</label></div>
    <div class="action-bank" id="action-bank"></div>
    <details class="scope"><summary>预览范围</summary><p>直接读取当前游戏模型、骨架、贴图和动作。这里展示单体造型与动作，不模拟游戏 AI、伤口、孕体变形、道具交互或声音同步。</p></details>
  </div>
</section>
<section id="audio" class="panel">
  <div class="audio-head"><span class="eyebrow">VOICE &amp; SOUND</span><h1>声音预览</h1><p id="audio-summary"></p></div>
  <div class="audio-filters"><select id="voice-species" aria-label="声音角色"><option value="">全部角色</option></select><select id="voice-age" aria-label="年龄"><option value="">全部声线</option></select><select id="voice-event" aria-label="对白事件"><option value="">全部场景</option></select><input id="voice-search" type="search" placeholder="搜索中文、日文或台词编号" aria-label="搜索声音"><button id="play-all">连续试听筛选结果</button><span id="sound-count"></span></div>
  <p class="audio-notice">家油复用对应灵梦／魔理沙声线；这批对白不含蕾米莉亚、弗兰的独立配音。</p>
  <div id="audio-list"></div>
  <div class="audio-player"><button id="audio-prev">上一条</button><div class="now"><strong id="now-title">选择一条声音开始试听</strong><span id="now-text"></span></div><audio id="player" controls preload="none"></audio><button id="audio-next">下一条</button><label><input id="auto-next" type="checkbox">连续播放</label><button id="stop-audio">停止</button><span id="audio-error" role="status"></span></div>
</section>
</main>
<script src="/preview/vendor/three.min.js"></script><script src="catalog.js"></script><script src="pose.js"></script><script src="app.js"></script></body></html>
