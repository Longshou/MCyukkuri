<!doctype html><meta charset="utf-8"><title>日记 APK：结构核读</title>
<style>body{margin:0;background:#eae7de;color:#393540;font-family:'Microsoft YaHei',sans-serif}header{position:absolute;top:25px;left:30px;pointer-events:none}h1{font-size:23px;margin:0 0 8px}p{font-size:13px;line-height:1.8;margin:0}canvas{display:block;width:100vw;height:100vh}.controls{position:absolute;bottom:24px;left:30px}button{padding:10px 18px;border:1px solid #c6beae;background:#f8f3e8;border-radius:5px;margin-right:8px;cursor:pointer}</style>
<header><h1>《油库里日记》APK 模型结构核读</h1><p>Body：951 顶点 / 17 骨骼　·　Hair04Marisa：380 顶点 / 2 骨骼<br>原资源只读参考重建；默认绑定姿态、简化材质，非游戏实机画面。</p></header>
<canvas></canvas><div class="controls"><button id="hair">显示 / 隐藏头发</button><button id="wire">线框</button><button id="front">正面</button><button id="angle">斜侧面</button></div>
<script src="../../preview/vendor/three.min.js"></script><script src="mesh-study.js"></script><script>
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color('#eae7de');const camera=new THREE.PerspectiveCamera(33,innerWidth/innerHeight,.01,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x776655,1));let light=new THREE.DirectionalLight(0xffffff,.4);light.position.set(-2,5,4);scene.add(light);
const group=new THREE.Group();scene.add(group);const material=new THREE.MeshLambertMaterial({side:THREE.DoubleSide});
new THREE.TextureLoader().load(TEXTURE,t=>{t.encoding=THREE.sRGBEncoding;material.map=t;material.needsUpdate=true;window.ready=true;});
for(const m of MODELS){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(m.vertices,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(m.uv,2));g.computeVertexNormals();let mesh=new THREE.Mesh(g,material);mesh.rotation.x=-Math.PI/2;mesh.name=String(m.id);group.add(mesh);}
const box=new THREE.Box3().setFromObject(group),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());group.position.sub(center);camera.position.set(0,.03,size.y*2.15);camera.lookAt(0,0,0);group.rotation.y=-.25;
document.querySelector('#hair').onclick=()=>group.children[1].visible=!group.children[1].visible;
document.querySelector('#wire').onclick=()=>material.wireframe=!material.wireframe;
document.querySelector('#front').onclick=()=>group.rotation.y=0;document.querySelector('#angle').onclick=()=>group.rotation.y=-.5;
function draw(){renderer.render(scene,camera);requestAnimationFrame(draw)}draw();
</script>
