<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>消耗品与普通胎生 · 实机审查</title><style>body{font:16px/1.65 system-ui,sans-serif;background:#f3eee5;color:#302b24;max-width:1280px;margin:auto;padding:24px}h1{font-size:28px}h2{font-size:21px}img{width:100%;display:block}figure{margin:0;background:white;border-radius:8px;overflow:hidden}figcaption{padding:10px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}.sequence{margin:24px 0;background:white;padding:18px;border-radius:8px}.sequence div{display:flex;gap:16px;padding-top:12px;align-items:center}input{flex:1}button{padding:8px 20px}a{color:#286283}</style><h1>消耗品与普通胎生 · 实机审查</h1><p>2026-09-13 最新冻结客户端；六件道具、口中份量、孕体、后部投药和前出口出生。造型仍待用户确认。</p><p>拖动滑杆逐帧观察，或播放原始帧序列。两只幼体由服务器真实 tick 产生；演示孕育时长缩为 200 tick。静态多角度场景用于检查网格挂接，角色行为被暂停。</p><section class="sequence" data-name="reproductive-dose" data-count="29" data-step="100"><h2>实际右击：投药提交</h2><img src="screenshots/reproductive-dose-0000.png" alt="实际右击：投药提交"><div><button>播放</button><input aria-label="选择帧" type="range" min="0" max="28" value="0"><output>0</output></div></section><section class="sequence" data-name="live-birth" data-count="68" data-step="150"><h2>真实 tick：两只幼体依次出生、落地</h2><img src="screenshots/live-birth-0000.png" alt="真实 tick：两只幼体依次出生、落地"><div><button>播放</button><input aria-label="选择帧" type="range" min="0" max="67" value="0"><output>0</output></div></section><h2>多角度与阶段</h2><div class="grid"><figure><a href="screenshots/props-0000.png"><img loading="lazy" src="screenshots/props-0000.png" alt="六件消耗品"></a><figcaption>六件消耗品</figcaption></figure><figure><a href="screenshots/mouth-0000.png"><img loading="lazy" src="screenshots/mouth-0000.png" alt="口中份量：酸奶、兴奋药、幼语药"></a><figcaption>口中份量：酸奶、兴奋药、幼语药</figcaption></figure><figure><a href="screenshots/pregnancy-0000.png"><img loading="lazy" src="screenshots/pregnancy-0000.png" alt="无孕／半程／孕满"></a><figcaption>无孕／半程／孕满</figcaption></figure>
