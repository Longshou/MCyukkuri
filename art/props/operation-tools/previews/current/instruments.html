<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>专用器具 · 当前实机预览</title><style>body{margin:32px auto;max-width:1200px;background:#f3efe4;color:#273735;font:16px system-ui}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}figure{margin:0;background:white;padding:10px}img{width:100%}figcaption{padding:8px}button,input{margin:10px}a{color:#315c57}</style><h1>专用器具 · 当前实机预览</h1><p>造型待确认。铁箱采用静态挂接样本；剪茎容器由实际胎次转移操作产生，振动序列由真实菜单触发。<a href="index.html">接触与滚动预览</a> · <a href="../../manifest.json">源与导出指纹</a></p><div class="grid"><figure><a href="instrument-box-front.png"><img loading="lazy" src="instrument-box-front.png"></a><figcaption>铁箱：灵梦正面观察栏</figcaption></figure><figure><a href="instrument-box-side.png"><img loading="lazy" src="instrument-box-side.png"></a><figcaption>铁箱：侧面</figcaption></figure><figure><a href="instrument-box-back.png"><img loading="lazy" src="instrument-box-back.png"></a><figcaption>铁箱：背面</figcaption></figure><figure><a href="instrument-box-house.png"><img loading="lazy" src="instrument-box-house.png"></a><figcaption>铁箱：家油尺寸</figcaption></figure><figure><a href="instrument-box-patchouli.png"><img loading="lazy" src="instrument-box-patchouli.png"></a><figcaption>铁箱：帕秋莉长发与帽饰</figcaption></figure><figure><a href="instrument-bottle-front.png"><img loading="lazy" src="instrument-bottle-front.png"></a><figcaption>培养瓶：正面</figcaption></figure><figure><a href="instrument-bottle-side.png"><img loading="lazy" src="instrument-bottle-side.png"></a><figcaption>培养瓶：瓶内直根与原弯茎</figcaption></figure><figure><a href="instrument-bottle-back.png"><img loading="lazy" src="instrument-bottle-back.png"></a><figcaption>培养瓶：另一方向</figcaption></figure><figure><a href="instrument-bare-stem.png"><img loading="lazy" src="instrument-bare-stem.png"></a><figcaption>普通剪茎：独立茎与实子</figcaption></figure><figure><a href="instrument-tools.png"><img loading="lazy" src="instrument-tools.png"></a><figcaption>工具陈列</figcaption></figure><figure><a href="instrument-menu.png"><img loading="lazy" src="instrument-menu.png"></a><figcaption>真实器具菜单</figcaption></figure></div><h2>振动操作与结束</h2><img id="motion"><button id="play">播放 / 暂停</button><input id="frame" type="range" min="0" value="0"><span id="label"></span><script>const frames=["vibration-00.png", "vibration-01.png", "vibration-02.png", "vibration-03.png", "vibration-04.png", "vibration-05.png", "vibration-06.png", "vibration-07.png", "vibration-08.png", "vibration-09.png", "vibration-10.png", "vibration-11.png", "vibration-12.png", "vibration-13.png"];const slider=document.querySelector('#frame');slider.max=frames.length-1;function show(){document.querySelector('#motion').src=frames[+slider.value];document.querySelector('#label').textContent=(+slider.value+1)+' / '+frames.length}slider.oninput=show;let playing=false;document.querySelector('#play').onclick=()=>playing=!playing;setInterval(()=>{if(playing){slider.value=(+slider.value+1)%frames.length;show()}},300);show();</script></html>
