<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>接触操作 · 当前实机预览</title><style>body{margin:32px auto;max-width:1200px;background:#f3efe4;color:#273735;font:16px system-ui}h1{font-size:28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}figure{margin:0;background:white;padding:10px}img{width:100%}figcaption{padding:8px}button,input{margin:10px}a{color:#315c57}</style><h1>接触操作 · 当前实机预览</h1><p>造型待确认。静态姿态用于检查挂接；下方滚动序列由真实客户端菜单触发。图像对应本次导出的原创器具，来源与指纹见 <a href="../../manifest.json">接入清单</a>。</p><div class="grid"><figure><a href="fixed-side.png"><img loading="lazy" src="fixed-side.png"></a><figcaption>仰卧固定：沿身体截面绕行的两条带子与承托垫</figcaption></figure><figure><a href="fixed-back.png"><img loading="lazy" src="fixed-back.png"></a><figcaption>仰卧固定：另一方向</figcaption></figure><figure><a href="sling.png"><img loading="lazy" src="sling.png"></a><figcaption>包裹悬吊：吊带与吊环</figcaption></figure><figure><a href="sling-side.png"><img loading="lazy" src="sling-side.png"></a><figcaption>包裹悬吊：侧面</figcaption></figure><figure><a href="hook.png"><img loading="lazy" src="hook.png"></a><figcaption>鱼钩悬吊：身体翻转后钩环与绳端相连</figcaption></figure><figure><a href="hook-side.png"><img loading="lazy" src="hook-side.png"></a><figcaption>鱼钩悬吊：斜侧面</figcaption></figure><figure><a href="pin.png"><img loading="lazy" src="pin.png"></a><figcaption>大头针：皮肤挂点</figcaption></figure><figure><a href="hair.png"><img loading="lazy" src="hair.png"></a><figcaption>剪发状态：原样、左侧、全部</figcaption></figure><figure><a href="tools-front.png"><img loading="lazy" src="tools-front.png"></a><figcaption>九种工具：一侧</figcaption></figure><figure><a href="tools-back.png"><img loading="lazy" src="tools-back.png"></a><figcaption>九种工具：另一侧</figcaption></figure><figure><a href="rolling-pose.png"><img loading="lazy" src="rolling-pose.png"></a><figcaption>滚动中间姿态</figcaption></figure><figure><a href="menu.png"><img loading="lazy" src="menu.png"></a><figcaption>真实客户端接触菜单</figcaption></figure></div><h2>连续滚动</h2><p>拖动查看接地、翻转与操作结束。</p><img id="motion"><button id="play">播放 / 暂停</button><input id="frame" type="range" min="0" value="0"><span id="label"></span><script>const frames=["roll-00.png", "roll-01.png", "roll-02.png", "roll-03.png", "roll-04.png", "roll-05.png", "roll-06.png", "roll-07.png", "roll-08.png", "roll-09.png", "roll-10.png", "roll-11.png", "roll-12.png", "roll-13.png", "roll-14.png", "roll-15.png", "roll-16.png", "roll-17.png"];const slider=document.querySelector('#frame');slider.max=frames.length-1;function show(){document.querySelector('#motion').src=frames[+slider.value];document.querySelector('#label').textContent=(+slider.value+1)+' / '+frames.length}slider.oninput=show;let playing=false;document.querySelector('#play').onclick=()=>playing=!playing;setInterval(()=>{if(playing){slider.value=(+slider.value+1)%frames.length;show()}},200);show();</script></html>
