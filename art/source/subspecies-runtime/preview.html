<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>亚种与先天形态 · 当前运行模型</title>
<style>
body{margin:0;background:#e9e5dc;color:#292c26;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.6}nav{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}label{display:flex;gap:6px;align-items:center}select,button{font:inherit;padding:8px;border:1px solid #aaa99e;border-radius:7px;background:#faf9f4}canvas{width:100%;height:570px;display:block;background:linear-gradient(#fbfaf4,#d9dac9);border-radius:12px;touch-action:none}input[type=range]{width:70%}#status{font-variant-numeric:tabular-nums}.note{font-size:14px;color:#62665b}
</style>
<main>
<h1>亚种与先天形态 · 当前运行模型</h1>
<p>螺壳复用已有确认造型。其余为待确认适配。拖动旋转、滚轮缩放，可暂停检查动作。</p>
<nav>
<label>角色 <select id="subject"><option value="marisa_tsumuri">螺壳魔理沙</option><option value="reimu_wasa">多毛灵梦</option><option value="reimu_sparse">灵梦 · 稀疏毛发</option><option value="reimu_face">灵梦 · 面部不足</option><option value="reimu_bean">灵梦 · 豆形细长</option><option value="marisa_sparse">魔理沙 · 稀疏毛发</option><option value="marisa_face">魔理沙 · 面部不足</option><option value="marisa_bean">魔理沙 · 豆形细长</option></select></label>
<label>动作 <select id="action"></select></label>
<label>表情 <select id="expression"><option value="neutral">neutral</option><option value="happy">happy</option><option value="cry">cry</option><option value="teary">teary</option><option value="drool">drool</option><option value="confused">confused</option><option value="yawn">yawn</option><option value="sleep">sleep</option><option value="angry">angry</option><option value="surprise">surprise</option><option value="sleepy">sleepy</option><option value="closed_smile">closed_smile</option><option value="chewing">chewing</option><option value="chewing_closed">chewing_closed</option><option value="satisfied">satisfied</option><option value="open_smile">open_smile</option></select></label>
<button id="play">暂停</button><button id="reset">恢复常态</button>
<label><input id="ground" type="checkbox" checked>显示地面</label>
<button data-angle="0">正面</button><button data-angle="1.570796">侧面</button><button data-angle="3.141593">背面</button>
</nav>
<canvas id="view" width="1000" height="570"></canvas>
<p><input id="time" type="range" min="0" max="1" step=".005"> <span id="status"></span></p>
<p class="note">使用本轮运行三角面、骨架和贴图。生长、乘船和受伤以真实客户端验收为准。</p>
</main>
<script src="preview-data.js"></script>
<script src="../../../standards/yukkuri-library/runtime/render.js"></script>
<script src="preview.js"></script>
</html>
