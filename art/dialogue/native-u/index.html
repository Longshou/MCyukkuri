<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>八景 U 原版对白整理</title><style>
body{margin:0;background:#f5f1e8;color:#253a30;font:15px/1.65 system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:32px 24px}h1{font-size:34px;margin:8px 0}header p{max-width:900px}.controls{position:sticky;top:0;padding:14px;background:#f5f1ef;display:flex;gap:10px;flex-wrap:wrap;border:1px solid #deddd0;border-radius:10px}select,input,button{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid #b9c7ba;background:white}input{flex:1;min-width:170px}table{border-collapse:collapse;width:100%;margin:16px 0;background:#fffdf6}th,td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid #dfdfd2}td:nth-child(1){width:190px}td:nth-child(2){width:155px}small{color:#627263}p{margin:7px 0}nav{display:flex;gap:14px;align-items:center}button{cursor:pointer}button:disabled{opacity:.4}code{overflow-wrap:anywhere}.mod{color:#8b503b}.translation{font-size:13px;color:#677563}
</style><main><header><small>HAKKEI U v9.8 / DIALOGUE SOURCES</small><h1>先从原版对白出发</h1><p>原版日语、成长阶段、场景分组和原始行号逐项保留。Mod 添加的对白单独显示。下方中文是既有汉化参考，不作为原版日文或新台词的来源。</p></header>
<div class="controls"><select id="origin" aria-label="来源"><option value="native">原版对白</option><option value="mod">Mod 新增（对照，未采用）</option></select><select id="species" aria-label="种族"><option value="">全部种族</option><option value="reimu">灵梦</option><option value="marisa">魔理沙</option><option value="arisu">爱丽丝</option><option value="patyu">帕秋莉</option><option value="tilen">橙</option></select><select id="age" aria-label="阶段"><option value="">全部阶段</option><option value="adult">成体</option><option value="young">幼语表</option></select><input id="query" aria-label="搜索" placeholder="搜索场景、台词、行号或文件"></div><p id="count"></p><nav><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav><table><thead><tr><th>来源</th><th>场景／阶段</th><th>台词</th></tr></thead><tbody id="rows"></tbody></table><small>本表是原版文本索引；不意味着全部场景已在 Minecraft 实现。幼语表由原版成长／シタタラン分支选择，不能把它当作现代汉语错字进行自动纠正。Mod 对照只包含独立 TSV，不声称覆盖全部代码内台词。</small></main>
<script src="catalogue-data.js"></script><script>
const $=id=>document.getElementById(id),names={reimu:'灵梦',marisa:'魔理沙',arisu:'爱丽丝',patyu:'帕秋莉',tilen:'橙'};let page=0,matched=[];const size=60;
function cell(text){const td=document.createElement('td');td.textContent=text;return td}
function render(){const mod=$('origin').value==='mod',q=$('query').value.trim().toLowerCase();matched=(mod?HAKKEI_DIALOGUE.mod_entries:HAKKEI_DIALOGUE.entries).filter(r=>mod?(!q||JSON.stringify(r).toLowerCase().includes(q)):((!$('species').value||r.species===$('species').value)&&(!$('age').value||r.age===$('age').value)&&(!q||[r.text,r.zh_reference,r.group,r.file,r.line].join(' ').toLowerCase().includes(q))));page=Math.min(page,Math.max(0,Math.ceil(matched.length/size)-1));$('count').textContent=`${mod?'Mod 对照':'原版'}：${matched.length} 条；原版共 ${HAKKEI_DIALOGUE.entries.length} 条。`;$('rows').replaceChildren();for(const r of matched.slice(page*size,(page+1)*size)){const tr=document.createElement('tr');tr.append(cell(`${mod?'Mod 新增，未采用':names[r.species]||r.species}\n${r.file} : ${r.line}`),cell(mod?'独立 TSV':r.group+' / '+(r.age==='adult'?'成体':'幼语')));const td=cell(mod?Object.entries(r.fields).map(([k,v])=>k+': '+v).join('\n'):r.text);if(!mod&&r.zh_reference){const p=document.createElement('p');p.className='translation';p.textContent='既有汉化参考：'+r.zh_reference;td.append(p)}tr.append(td);$('rows').append(tr)}$('page').textContent=`${page+1} / ${Math.max(1,Math.ceil(matched.length/size))}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=matched.length;$('species').disabled=mod;$('age').disabled=mod}
for(const id of ['origin','species','age','query'])$(id).addEventListener('input',()=>{page=0;render()});$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};render();
</script></html>
