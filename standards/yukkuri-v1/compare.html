<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔理沙 / 灵梦 · 全动作对照</title><style>*{box-sizing:border-box}body{margin:20px;background:#eae7de;color:#51463e;font:16px system-ui}h1{font-size:24px;margin-bottom:8px}button,select{padding:9px 13px;margin:4px;background:#fff6e4;color:inherit;border:1px solid #b8aa91;border-radius:8px;cursor:pointer}button.active{background:#625641;color:white}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}section{display:flex;gap:12px}iframe{width:50%;height:600px;border:1px solid #b8aa91;border-radius:12px}input{accent-color:#857258}#progress{flex:1;min-width:180px}#status{min-width:130px}.note{font-size:13px;color:#796f60}@media(max-width:700px){section{flex-direction:column}iframe{width:100%}}</style><h1>魔理沙 / 灵梦 · 全动作对照</h1><p>拖动任一角色即可同步旋转视角，滚轮缩放；触屏支持单指旋转、双指缩放。播放和暂停时均可调整。</p><div id="clips" class="row"></div><div class="row"><button id="play">暂停</button><button id="reset">从头播放</button><label><input id="loop" type="checkbox" checked>循环</label><label><input id="sequence" type="checkbox">依次播放全部</label><select id="speed" aria-label="速度"><option value=".5">0.5 倍速</option><option selected value="1">1 倍速</option><option value="1.5">1.5 倍速</option></select><input type="range" id="progress" min="0" max="6.4" step=".01" value="0" aria-label="动作进度"><span id="status"></span></div><div class="row"><button data-angle="0">正面</button><button data-angle="1.5708">侧面</button><button data-angle="3.14159">背面</button><button data-angle="2.3">后侧</button><button id="camera">重置视角</button><label>表情 <select id="expression"><option value="auto">随动作</option><option value="neutral">普通</option><option value="surprise">受惊（共用）</option></select></label><label><input type="checkbox" id="body">只看身体</label></div><p class="note" id="note"></p><section><iframe title="魔理沙" src="assembled/marisa/index.html?compare=1"></iframe><iframe title="灵梦" src="assembled/reimu/index.html?compare=1"></iframe></section><script>
const clips=[['puff','噗咕',6.4],['stretch','伸长',2.8],['waddle','甩臀 / 走动',1.2],['flee','受惊逃跑',5],['exercise_sides','左右体操',2.36],['exercise_vertical','上下体操',2.62],['press','用力体操',4.8],['taiso','整套体操',14]];
let index=0,time=0,playing=true,last=0,az=-.45,el=.14,span=14.5;const get=id=>document.getElementById(id),frames=[...document.querySelectorAll('iframe')];
function sync(){get('play').textContent=playing?'暂停':'播放';get('progress').max=clips[index][2];get('progress').value=time;get('status').textContent=time.toFixed(2)+' / '+clips[index][2].toFixed(2)+' 秒';get('note').textContent='两个角色同步播放；表情可独立切换。';document.querySelectorAll('[data-clip]').forEach((b,i)=>b.classList.toggle('active',i===index));}
function select(i){index=i;time=0;playing=true;sync();}
clips.forEach(([id,label],i)=>{const b=document.createElement('button');b.textContent=label;b.dataset.clip=id;b.onclick=()=>select(i);get('clips').append(b)});
get('play').onclick=()=>{playing=!playing;sync()};get('reset').onclick=()=>select(index);get('progress').oninput=e=>{time=+e.target.value;playing=false;sync()};get('camera').onclick=()=>{az=-.45;el=.14;span=14.5};document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{az=+b.dataset.angle;el=.12});
window.addEventListener('message',e=>{if(e.data?.type==='standard-camera'&&frames.some(f=>f.contentWindow===e.source)){az=e.data.az;el=e.data.el;span=e.data.span;}});
function tick(now){if(last&&playing)time+=Math.min(.1,(now-last)/1000)*+get('speed').value;last=now;if(time>=clips[index][2]&&playing){if(get('sequence').checked){index=(index+1)%clips.length;time=0}else if(get('loop').checked)time%=clips[index][2];else{time=clips[index][2];playing=false}}sync();for(const frame of frames)frame.contentWindow.postMessage({type:'standard-compare',clip:clips[index][0],time,az,el,span,bodyOnly:get('body').checked,expression:get('expression').value},'*');requestAnimationFrame(tick)}sync();requestAnimationFrame(tick);
</script></html>
