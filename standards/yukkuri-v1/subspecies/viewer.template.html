<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔理沙 · 三种形态</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae0;color:#423f35;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1360px;margin:auto;padding:28px 30px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1{font-size:29px;margin:0;font-weight:650}p{margin:8px 0}.eyebrow{font-size:12px;color:#77725f;letter-spacing:.13em}a{color:#68593b}header a{text-decoration:none;font-size:13px}button,select{font:inherit;color:inherit;border:1px solid #c8c3b4;background:#faf8f1;border-radius:7px;padding:8px 13px;cursor:pointer}button:hover{border-color:#77725f}button.active{background:#545e4c;color:white;border-color:#545e4c}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:18px 0}.stage{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(#e7e8e0,#dddacb);border:1px solid #d7d3c5}canvas{display:block;width:100%;height:580px;cursor:grab;touch-action:none}.stage-badge{position:absolute;top:14px;left:18px;pointer-events:none;color:#777765;font-size:12px}#caption{min-height:25px;color:#77725f;font-size:13px}.spacer{flex:1}#phase{flex:1;min-width:100px;accent-color:#65735a}#status{font-variant-numeric:tabular-nums;font-size:13px;min-width:102px}.download{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;padding-top:12px;border-top:1px solid #d3cebf}.note{font-size:12px;color:#807969}label{display:inline-flex;gap:6px;align-items:center}@media(max-width:700px){main{padding:18px 12px}h1{font-size:23px}header{align-items:flex-start}canvas{height:520px}button,select{padding:7px 10px}.toolbar{margin:12px 0}.spacer{display:none}}
</style>
<main>
<header><div><div class="eyebrow">YUKKURI / MARISA VARIANTS</div><h1>魔理沙 · 三种形态</h1><p>沿用标准普通种的体型、金发与独立辫子。</p></div><a href="../index.html">返回标准模型 ↗</a></header>
<div class="toolbar" id="characters"><button data-kind="all" class="active">四种对照</button><button data-kind="tsumuri">螺壳魔理沙</button><button data-kind="aquatic">水生魔理沙</button><button data-kind="kotatsu">被炉魔理沙</button><button data-kind="ordinary">普通种</button><span class="spacer"></span><label>表情 <select id="expression"><option value="neutral">普通</option><option value="happy">开心</option><option value="sleepy">困倦</option><option value="sleep">睡着</option></select></label></div>
<div class="stage"><div class="stage-badge">拖动旋转 · 滚轮缩放 · 触屏双指缩放</div><canvas id="view" aria-label="可旋转的普通、螺壳、水生、被炉魔理沙三维对照"></canvas></div>
<p id="caption">同一缩放比例；普通种作为体型对照。</p>
<div class="toolbar"><button data-clip="still" class="active">静止</button><button data-clip="idle">待机</button><button data-clip="move">形态动作</button><button data-clip="retract">螺壳 · 缩入 / 探出</button><button id="play">播放</button><input type="range" id="phase" aria-label="动作时间" min="0" max="4" step=".02" value="0"><span id="status">加载中…</span></div>
<p><a href="../../yukkuri-library/assembled/marisa_tsumuri/index.html">螺壳标准模型 · 已接入麻姆麻姆与佩尼佩尼 →</a></p><div class="toolbar"><button data-view="0">正面</button><button data-view="1.57079632679">侧面</button><button data-view="3.14159265359">背面</button><button id="top">俯视</button><button id="reset">重置视角</button><span class="spacer"></span><button id="left-hand">抬左辫</button><button id="right-hand">抬右辫</button></div>
<div class="download" id="downloads"></div>
<p class="note">待机与形态动作是模型展示动作：卷壳轻摆、帽船浮动与摆辫、被炉探头。<a href="README.md">模型与参考说明</a></p>
</main>
<script>
const MODELS=__DATA__;
__RUNTIME__
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),texturePixels={};
const kinds=['ordinary','tsumuri','aquatic','kotatsu'];
const descriptions={ordinary:'标准普通魔理沙 · 保留原始体型、黑色魔女帽与白蝴蝶结。',tsumuri:'螺壳魔理沙 · 稍圆润、缩小的塔形卷壳，左右戴正，后缘刚好盖到油菊上方；扁身收辫后缩入；点击「缩入 / 探出」查看。',aquatic:'水生魔理沙 · 帽子倒置成开口小船，白色帽带与蝴蝶结随船保留。',kotatsu:'被炉魔理沙 · 棕色桌板、红被面与白包边，金发和脸从前方露出。',all:'同一缩放比例；普通种作为体型对照。'};
let kind='all',clip='still',time=0,playing=false,az=-.48,el=.22,span=18.5,expression='neutral',ready=false,dirty=true,last=0;
let hands={left:false,right:false};const pointers=new Map(),customRigs=new Map();
function modelRig(key){const cache=key+hands.left+hands.right;if(customRigs.has(cache))return customRigs.get(cache);const rig=structuredClone(MODELS[key].rig);for(const c of Object.values(rig.clips))for(const side of ['left','right'])if(hands[side])c.tracks['hand_'+side]={rotation:{0:[0,0,side==='left'?-35:35]}};customRigs.set(cache,rig);return rig;}
function duration(){return MODELS[kind==='all'?'ordinary':kind].rig.clips[clip]?.duration||4;}
function sync(){document.querySelectorAll('[data-kind]').forEach(b=>{b.classList.toggle('active',b.dataset.kind===kind);b.setAttribute('aria-pressed',String(b.dataset.kind===kind));});document.querySelectorAll('[data-clip]').forEach(b=>{b.classList.toggle('active',b.dataset.clip===clip);b.setAttribute('aria-pressed',String(b.dataset.clip===clip));});document.getElementById('play').textContent=playing?'暂停':'播放';document.getElementById('play').setAttribute('aria-pressed',String(playing));document.getElementById('phase').max=duration();document.getElementById('phase').value=time;document.getElementById('status').textContent=ready?time.toFixed(2)+' / '+duration().toFixed(2)+' 秒':'加载中…';document.getElementById('caption').textContent=descriptions[kind];for(const side of ['left','right'])document.getElementById(side+'-hand').classList.toggle('active',hands[side]);const downloads=document.getElementById('downloads');const selected=kind==='all'?kinds.slice(1):[kind];downloads.innerHTML=selected.map(k=>`<a href="${k}/marisa.bbmodel" download>${MODELS[k].label} · BBModel ↓</a>`).join('')+(kind==='all'?'':`<a href="${kind}/marisa.geo.json" download>几何 JSON ↓</a><a href="${kind}/marisa.png" download>贴图 PNG ↓</a><a href="${kind}/marisa.animation.json" download>动画 JSON ↓</a>`);}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;if(!MODELS[kind==='all'?'ordinary':kind].rig.clips[clip]){clip='still';time=0;playing=false;}dirty=true;sync();});
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{clip=b.dataset.clip;if(clip==='retract')kind='tsumuri';time=0;playing=clip!=='still';dirty=true;sync();});
document.getElementById('expression').onchange=e=>{expression=e.target.value;dirty=true;};
document.getElementById('play').onclick=()=>{if(clip==='still')clip='idle';playing=!playing;dirty=true;sync();};
document.getElementById('phase').oninput=e=>{time=Number(e.target.value);playing=false;dirty=true;sync();};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{az=Number(b.dataset.view);el=.1;dirty=true;});
document.getElementById('top').onclick=()=>{el=1.1;dirty=true;};document.getElementById('reset').onclick=()=>{az=-.48;el=.22;span=18.5;dirty=true;};
for(const side of ['left','right'])document.getElementById(side+'-hand').onclick=()=>{hands[side]=!hands[side];dirty=true;sync();};
function distance(){const p=[...pointers.values()];return p.length===2?Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]):0;}
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId),before=distance();pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){az-=(e.clientX-p[0])*.009;el=Math.max(-1.35,Math.min(1.5,el+(e.clientY-p[1])*.009));}else if(before){span=Math.max(10,Math.min(29,span*before/distance()));}dirty=true;});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();span=Math.max(10,Math.min(29,span*Math.exp(e.deltaY*.001)));dirty=true;},{passive:false});
function drawOne(key,x,y,w,h){if(w<1||h<1)return;const m=MODELS[key],rig=modelRig(key),v=poseVertices(m.vertices,rig,time,true,false,clip);const fit=Math.max(span,15*h/w);const pixels=renderModel(v,texturePixels[key][expression],w,h,az,el,fit,{centerY:(kind==='all'||key==='tsumuri')?12:10});ctx.putImageData(new ImageData(pixels,w,h),x,y);ctx.fillStyle='#565e4c';ctx.textAlign='center';ctx.font='15px system-ui';if(kind==='all')ctx.fillText(m.label,x+w/2,y+h-13);}
function draw(){const w=Math.round(canvas.clientWidth),h=Math.round(canvas.clientHeight);if(w<8||h<8)return;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}ctx.clearRect(0,0,w,h);if(kind==='all'){const narrow=w<820,cols=narrow?2:4,rows=narrow?2:1,cw=Math.floor(w/cols),ch=Math.floor(h/rows);for(let i=0;i<4;i++)drawOne(kinds[i],(i%cols)*cw,Math.floor(i/cols)*ch,cw,ch);}else drawOne(kind,0,0,w,h);dirty=false;}
Promise.all(kinds.map(async key=>{texturePixels[key]={};await Promise.all(Object.entries(MODELS[key].textures).map(([name,src])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.drawImage(im,0,0);texturePixels[key][name]=x.getImageData(0,0,256,256).data;resolve();};im.onerror=reject;im.src=src;})));})).then(()=>{ready=true;dirty=true;sync();}).catch(e=>{document.getElementById('status').textContent='贴图加载失败';console.error(e);});
function frame(now){const dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(ready&&playing){time=(time+dt)%duration();dirty=true;document.getElementById('phase').max=duration();document.getElementById('phase').value=time;document.getElementById('status').textContent=time.toFixed(2)+' / '+duration().toFixed(2)+' 秒';}if(canvas.width!==Math.round(canvas.clientWidth)||canvas.height!==Math.round(canvas.clientHeight))dirty=true;if(ready&&dirty)draw();requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>last=0);
window.variantsDebug={ready:()=>ready,state:()=>({kind,clip,time,playing,az,el,span,expression,hands}),set(state){({kind,clip,time,playing,az,el,span,expression}={kind,clip,time,playing,az,el,span,expression,...state});document.getElementById('expression').value=expression;dirty=true;sync();},pose(key,t,action='move'){return poseVertices(MODELS[key].vertices,modelRig(key),t,true,false,action);},models:MODELS,draw};
const query=new URLSearchParams(location.search);if(kinds.includes(query.get('kind')))kind=query.get('kind');sync();requestAnimationFrame(frame);
</script></html>
