<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>标准灵梦 · 胎生</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:#3f4838;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1220px;margin:auto;padding:26px 30px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:30px;margin:5px 0}p{margin:6px 0 14px}a{color:#556b42}.eyebrow{font-size:12px;letter-spacing:2px;color:#748166}button,select{font:inherit;color:inherit;border:1px solid #c5ccba;border-radius:7px;background:#fafaf4;padding:7px 13px;cursor:pointer}button:hover{border-color:#526648}button.primary{background:#526648;color:white}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:13px 0}.stage{position:relative;border:1px solid #d4dacb;border-radius:12px;overflow:hidden;background:linear-gradient(#f8f8f0,#e6ebdd)}canvas{display:block;width:100%;height:540px;touch-action:none;cursor:grab}.badge{position:absolute;left:18px;top:14px;pointer-events:none}.badge strong{font-size:21px;display:block}.badge span{font-size:13px;color:#79816e}.hint{position:absolute;right:18px;bottom:12px;font-size:12px;color:#7c8574;pointer-events:none}.range{flex:1;min-width:160px}input{accent-color:#637e4e}#clock{font-variant-numeric:tabular-nums;min-width:105px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}.card{padding:13px 17px;border-radius:10px;background:#fafaf4;border:1px solid #d5d9cc}.card h2{font-size:16px;margin:0}.card b{font-size:21px;font-weight:550}.muted,.card p{color:#77806d;font-size:13px}.card p{margin:3px 0 0}footer{font-size:13px;color:#78816d;border-top:1px solid #d1d6c8;padding-top:14px;margin-top:20px}#notice{font-size:13px;min-height:21px;color:#627749}[hidden]{display:none!important}@media(max-width:680px){main{padding:16px}header{align-items:start}header nav{font-size:12px}h1{font-size:25px}canvas{height:460px}.cards{gap:6px}.card{padding:10px}.card b{font-size:18px}button{padding:7px 10px}.badge strong{font-size:17px}}
</style>
<main><header><div><div class="eyebrow">YUKKURI · LIFE CYCLE 02</div><h1>标准灵梦 · 胎生</h1></div><nav><a href="../lifecycle/index.html">茎生与成长</a> · <a href="../index.html">角色标准 ↗</a></nav></header>
<p class="muted">孕体下部膨大，阵痛时用力，赤体从正面嘴巴下方依次产出。出口随赤体撑开、贴合和回缩；可切换出口近景查看挤压过程。</p>
<div class="stage"><canvas id="view" aria-label="可旋转的标准灵梦胎生预览"></canvas><div class="badge"><strong id="phase-label">载入中</strong><span id="phase-detail"></span></div><span class="hint">拖动旋转 · 滚轮 / 双指缩放</span></div>
<div class="controls"><button id="play" class="primary">播放</button><button id="restart">从头播放</button><label><input type="checkbox" id="loop">循环</label><label>速度 <select id="speed"><option value="0.5">0.5 倍</option><option value="1" selected>1 倍</option><option value="2">2 倍</option></select></label><input id="timeline" class="range" type="range" min="0" max="32" step="0.01" value="9" aria-label="胎生进度"><span id="clock"></span></div>
<div class="controls"><label>本次数量 <select id="count"><option value="1">1 只</option><option value="2">2 只</option><option value="3" selected>3 只</option><option value="4">4 只</option><option value="5">5 只</option></select></label><button id="random-count">随机一胎</button><label>亲代体型 <input id="mother" type="range" min="0.8" max="1.2" step="0.01" value="1"><span id="mother-size"></span></label></div>
<div class="controls"><button data-time="0">标准体型</button><button data-time="9">临产孕体</button><button data-time="12.9">阵痛用力</button><button data-time="14.55">挤压接触</button><button data-time="15.25">第一只产出</button><button data-time="32">产后恢复</button></div>
<div class="controls"><button data-angle="0">正面</button><button data-angle="1.570796">侧面</button><button data-angle="3.141593">背面</button><button id="outlet-closeup" aria-pressed="false">出口近景</button><button id="reset-camera">重置视角</button><button id="save">保存当前预览</button><button id="load">恢复预览</button></div><div id="notice" role="status"></div><div id="birth-cards" class="cards"></div>
<footer>美术参考：<a href="https://blog.livedoor.jp/yukkuri_anko/archives/33171816.html">CADあき《胎生出産その力》</a>、<a href="https://blog.livedoor.jp/yukkuri_anko/archives/37659311.html">無声あき《こたつむりの出産で》</a>、<a href="https://blog.livedoor.jp/yukkuri_anko/archives/29895367.html">AVあき《お引越し漫画》</a>。对照鼓起、收拢与撑开的画格，改为闭合边缘与接触挤压。生产出口与后侧生殖挂点分开。<br>本页胎数、0.18 倍赤体和 32 秒演示为项目适配。当前为模型与行为预览，尚未接入 Minecraft 实体。<a href="../references/viviparous-comics.md">参考核读</a> · <a href="../behaviors/viviparous-birth.json">胎生参数</a> · <a href="../actions/README.md">已确认标准动作</a></footer>
</main><script>
const DATA=__DATA__;
__RUNTIME__
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d'),timing=DATA.viviparous.preview_seconds;
let time=9,count=DATA.viviparous.offspring_count.preview_default,motherScale=1,az=.48,el=.16,span=12.5,closeup=false,playing=false,ready=false,dirty=true,last=0,texture;
const pointers=new Map();
for(let i=0;i<5;i++)$('birth-cards').insertAdjacentHTML('beforeend','<div class="card"><h2>赤体 '+(i+1)+'</h2><b id="child-size-'+i+'"></b><p id="child-state-'+i+'"></p></div>');
function state(){return YukkuriViviparous.sample(DATA,time,motherScale,count);}
function sync(){const s=state();$('play').textContent=playing?'暂停':'播放';$('play').setAttribute('aria-pressed',String(playing));$('timeline').value=time;$('clock').textContent=time.toFixed(1)+' / '+timing.end+' 秒';$('count').value=count;$('mother').value=motherScale;$('mother-size').textContent=motherScale.toFixed(2)+' 倍';$('phase-label').textContent=s.phase;$('phase-detail').textContent='已出生 '+s.born+' / '+count+' · '+(s.straining?'用力':'标准灵梦');[...$('birth-cards').children].forEach((c,i)=>c.hidden=i>=count);s.children.forEach((c,i)=>{$('child-size-'+i).textContent=c.visible?c.scale.toFixed(2)+' 倍':'胎内';$('child-state-'+i).textContent=c.landed?'赤体 · 落地清醒':c.born?'赤体 · 出生落地中':c.visible?'赤体 · 正在产出':'尚未出生 · 外部不可见';});}
function seek(t){time=Math.max(0,Math.min(timing.end,t));playing=false;dirty=true;sync();}
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>seek(Number(b.dataset.time)));
$('play').onclick=()=>{if(time>=timing.end)time=0;playing=!playing;last=0;dirty=true;sync();};$('restart').onclick=()=>{time=0;playing=true;last=0;dirty=true;sync();};$('timeline').oninput=e=>seek(Number(e.target.value));
$('count').onchange=e=>{count=YukkuriViviparous.validateCount(DATA,Number(e.target.value));playing=false;dirty=true;sync();};$('mother').oninput=e=>{motherScale=Number(e.target.value);dirty=true;sync();};$('random-count').onclick=()=>{count=YukkuriViviparous.randomCount(DATA);time=0;playing=true;last=0;dirty=true;sync();};
function setCloseup(value){closeup=value;$('outlet-closeup').setAttribute('aria-pressed',String(value));$('outlet-closeup').textContent=value?'返回全景':'出口近景';dirty=true;}
$('outlet-closeup').onclick=()=>setCloseup(!closeup);
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{az=Number(b.dataset.angle);el=.16;dirty=true;});$('reset-camera').onclick=()=>{az=.48;el=.16;span=12.5;setCloseup(false);dirty=true;};
function distance(){const p=[...pointers.values()];return p.length===2?Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]):0;}
canvas.onpointerdown=e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),before=distance();pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){az-=(e.clientX-old[0])*.008;el=Math.max(-.4,Math.min(1.2,el+(e.clientY-old[1])*.008));}else if(before>0&&distance()>0)span=Math.max(8,Math.min(32,span*before/distance()));dirty=true;};for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>pointers.delete(e.pointerId));canvas.addEventListener('wheel',e=>{e.preventDefault();span=Math.max(8,Math.min(32,span*Math.exp(e.deltaY*.001)));dirty=true;},{passive:false});
function snapshot(){return {version:1,behavior:DATA.viviparous.id,time,count,motherScale,az,el,span,closeup};}
function restore(s){if(s.version!==1||s.behavior!==DATA.viviparous.id||![s.time,s.motherScale,s.az,s.el,s.span].every(Number.isFinite)||s.time<0||s.time>timing.end||s.el<-.4||s.el>1.2||s.span<8||s.span>32||(s.closeup!==undefined&&typeof s.closeup!=='boolean'))throw new Error('无效的胎生预览存档');YukkuriViviparous.sample(DATA,s.time,s.motherScale,s.count);({time,count,motherScale,az,el,span}=s);setCloseup(s.closeup===true);playing=false;dirty=true;sync();}
$('save').onclick=()=>{try{localStorage.setItem('yukkuri-reimu-viviparous-v1',JSON.stringify(snapshot()));$('notice').textContent='已保存胎生进度、数量、体型与镜头。';}catch(e){$('notice').textContent='保存失败：'+e.message;}};$('load').onclick=()=>{try{const raw=localStorage.getItem('yukkuri-reimu-viviparous-v1');if(!raw){$('notice').textContent='还没有胎生预览存档。';return;}restore(JSON.parse(raw));$('notice').textContent='已恢复胎生预览。';}catch(e){$('notice').textContent='恢复失败：'+e.message;}};
const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.drawImage(im,0,0);texture=x.getImageData(0,0,128,128).data;ready=true;dirty=true;};im.onerror=()=>{$('notice').textContent='贴图加载失败。';};im.src=DATA.texture;
function frame(now){const dt=last?(now-last)/1000:0;last=now;if(playing&&ready){time+=dt*Number($('speed').value);if(time>=timing.end){if($('loop').checked)time%=timing.end;else{time=timing.end;playing=false;}}dirty=true;sync();}const w=Math.min(1000,Math.round(canvas.clientWidth)),h=Math.round(canvas.clientHeight);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true;}if(ready&&dirty){const sample=state(),viewSpan=closeup?Math.max(span*.28,6*h/w):Math.max(span,19*h/w);ctx.putImageData(new ImageData(renderModel(YukkuriViviparous.geometry(DATA,sample),texture,w,h,az,el,viewSpan,{centerY:closeup?sample.outlet[1]+.3:6,centerZ:closeup?sample.outlet[2]-.4:-3,colors:DATA.viviparous.palette}),w,h),0,0);dirty=false;}requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>last=0);window.viviparousDebug={ready:()=>ready,state:()=>({...snapshot(),playing,sample:state()}),setTime:seek,restore,data:DATA};sync();requestAnimationFrame(frame);
</script></html>
