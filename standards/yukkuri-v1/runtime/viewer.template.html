<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔理沙 · B 动作预览</title><style>*{box-sizing:border-box}body{margin:0;background:#eae7de;color:#51463e;font:16px system-ui}main{max-width:1140px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 10px}p{line-height:1.6}.stage{background:linear-gradient(#eae7de 87%,#dcd6c8);border-radius:14px;overflow:hidden}canvas{width:100%;height:540px;display:block;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}button,a{color:#51463e}button{background:#fff6e4;border:1px solid #b8aa91;border-radius:8px;padding:10px 16px;cursor:pointer}button.active{background:#625641;color:white}#phase{flex:1;min-width:160px;accent-color:#857258}.note{font-size:13px;color:#796f60}#status{min-width:130px}footer{margin-top:20px}@media(max-width:650px){main{padding:14px}canvas{height:410px}button{padding:8px 12px}}.compare main>p,.compare .controls,.compare footer{display:none}.compare main{padding:14px}.compare canvas{height:480px}</style>
<main><h1>魔理沙 · 标准组件动作预览</h1><p>拖动可随时旋转视角，滚轮缩放；触屏单指旋转、双指缩放。播放和暂停时都能调整角度。</p><div class="controls">__CLIP_BUTTONS__</div><div class="controls"><button id="hand-left">抬左辫</button><button id="hand-right">抬右辫</button></div><div class="stage"><canvas id="view" aria-label="可自由旋转的魔理沙动画预览"></canvas></div><div class="controls"><button id="play">暂停</button><button id="replay">从头播放</button><label><input type="checkbox" id="loop" checked>循环</label><input id="phase" type="range" min="0" max="6.4" step=".02" value="0" aria-label="动作进度"><span id="status">载入中…</span></div><div class="controls"><button data-view="0">正面</button><button data-view="1.5708">侧面</button><button data-view="3.14159">背面</button><button data-view="2.3">后侧看油臀</button><button id="reset-camera">重置视角</button></div><footer><a href="marisa.bbmodel" download>下载此体型模型</a><p class="note">由独立体型、油臀、辫子、表情和动作数据组装。辫子可单独活动；允许少量穿模，不与身体蒙皮合并。可拖动旋转、缩放。</p></footer></main>
<script>__RUNTIME__
if(new URLSearchParams(location.search).has('compare'))document.body.classList.add('compare');
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),textures={},model=DATA.models.b,durations=__DURATIONS__;let expression='auto';let bodyOnly=false;let clip='puff',time=0,az=-.45,el=.14,span=14.5,centerY=9.5,playing=false,last=0,dirty=true,ready=false;
const contact=DATA.contactReveal?new ContactReveal(DATA.contactReveal):null;
const expressionRigs=new WeakMap();function expressionRig(rig,preset){if(preset!=='surprise')return rig;let r=expressionRigs.get(rig);if(r)return r;r=structuredClone(rig);const names=new Set(r.bones.map(b=>b.name));for(const c of Object.values(r.clips)){for(const n of ['face_rest','face_eye_left','face_eye_right','face_mouth','face_rest_left_eye','face_rest_right_eye','face_rest_mouth'])if(names.has(n)){c.tracks[n]??={};c.tracks[n].scale={0:[1,1,1]};}for(const n of ['face_effort','puff_eye_left','puff_eye_right','puff_mouth'])if(names.has(n)){c.tracks[n]??={};c.tracks[n].scale={0:[.000001,.000001,.000001]};}}expressionRigs.set(rig,r);return r;}
const bindRig=structuredClone(model.rig),hands={left:false,right:false};for(const side of ['left','right'])document.getElementById('hand-'+side).onclick=()=>{hands[side]=!hands[side];model.rig=structuredClone(bindRig);for(const c of Object.values(model.rig.clips))for(const s of ['left','right'])if(hands[s])c.tracks['hand_'+s]={rotation:{0:[0,0,s==='left'?-35:35]}};dirty=true;};
const phase=document.getElementById('phase'),play=document.getElementById('play'),pointers=new Map();
function sync(){play.textContent=playing?'暂停':'播放';play.setAttribute('aria-pressed',String(playing));phase.max=durations[clip];phase.value=time;document.getElementById('status').textContent=time.toFixed(2)+' / '+durations[clip].toFixed(2)+' 秒';document.querySelectorAll('[data-clip]').forEach(b=>{b.classList.toggle('active',b.dataset.clip===clip);b.setAttribute('aria-pressed',String(b.dataset.clip===clip));});}
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{clip=b.dataset.clip;time=0;playing=true;dirty=true;sync();});
play.onclick=()=>{if(time>=durations[clip])time=0;playing=!playing;dirty=true;sync();};document.getElementById('replay').onclick=()=>{time=0;playing=true;dirty=true;sync();};phase.oninput=e=>{time=Number(e.target.value);playing=false;dirty=true;sync();};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{az=Number(b.dataset.view);el=.12;centerY=9.5;dirty=true;});document.getElementById('reset-camera').onclick=()=>{az=-.45;el=.14;span=14.5;centerY=9.5;dirty=true;};
function distance(){const p=[...pointers.values()];return p.length===2?Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]):0;}
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),before=distance();pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){az-=(e.clientX-old[0])*.009;el=Math.max(-.6,Math.min(1.2,el+(e.clientY-old[1])*.009));}else if(before>0){const after=distance();if(after>0)span=Math.max(10,Math.min(25,span*before/after));}dirty=true;});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>{pointers.delete(e.pointerId);if(!pointers.size)canvas.classList.remove('dragging');});
canvas.addEventListener('wheel',e=>{e.preventDefault();span=Math.max(10,Math.min(25,span*Math.exp(e.deltaY*.001)));dirty=true;},{passive:false});
Promise.all(Object.entries(DATA.textures).map(([k,src])=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.drawImage(im,0,0);textures[k]=x.getImageData(0,0,128,128).data;res();};im.onerror=rej;im.src=src;}))).then(()=>{ready=true;last=0;dirty=true;}).catch(()=>document.getElementById('status').textContent='贴图加载失败');
function frame(now){const dt=last?(now-last)/1000:0;last=now;if(contact&&contact.update(Math.min(dt,.1)))dirty=true;if(contact){const label=contact.activePart!==contact.selectedPart?'切换 · 先收回':contact.touching?'接触中':contact.amount>0?'恢复中':'已隐藏';document.getElementById('contact-status').textContent=label+' · '+Math.round(contact.amount*100)+'%';}if(playing&&ready){time+=dt;if(time>=durations[clip]){if(document.getElementById('loop').checked)time%=durations[clip];else{time=durations[clip];playing=false;}}dirty=true;sync();}const w=Math.min(960,Math.round(canvas.clientWidth)),h=Math.round(canvas.clientHeight);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true;}if(ready&&dirty){const preset=expression==='auto'?(clip==='flee'?'surprise':'neutral'):expression;const originalRig=model.rig;model.rig=expressionRig(originalRig,preset);if(contact)model.rig.boneOverrides=contact.overrides();const originalVertices=model.vertices;model.vertices=model.expressionVertices?.[preset]||originalVertices;let v=clip==='flee'?fleePose('b',time,-Math.PI/2).vertices:poseVertices(model.vertices,model.rig,time,true,false,clip);model.vertices=originalVertices;delete model.rig.boneOverrides;model.rig=originalRig;if(bodyOnly)v=v.slice(0,model.spec.bodyCubeCount*288);const tex=textures[preset]||textures.neutral;ctx.putImageData(new ImageData(renderModel(v,tex,w,h,az,el,Math.max(span,13*h/w),{centerY}),w,h),0,0);dirty=false;}requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>last=0);window.actionsDebug={ready:()=>ready,state:()=>({clip,time,az,el,span,playing}),setTime(t){time=t;playing=false;dirty=true;sync();}};function shareCamera(){if(new URLSearchParams(location.search).has('compare'))parent.postMessage({type:'standard-camera',az,el,span},'*');}canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId))shareCamera();});canvas.addEventListener('wheel',shareCamera);
window.addEventListener('message',e=>{if(e.data?.type!=='standard-compare')return;const d=e.data;expression=d.expression||'auto';const available=d.clip==='flee'||!!model.rig.clips[d.clip];clip=available?d.clip:'puff';time=available?d.time:0;let badge=document.getElementById('availability');if(!badge){badge=document.createElement('div');badge.id='availability';badge.style.cssText='height:24px;font-size:13px;color:#796f60';document.querySelector('h1').after(badge);}badge.textContent=available?'': '此角色暂无该动作 · 显示静止姿态';az=d.az;el=d.el;span=d.span;bodyOnly=d.bodyOnly;playing=false;dirty=true;sync();});initContactControls();sync();requestAnimationFrame(frame);
</script></html>
