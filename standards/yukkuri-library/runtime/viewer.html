<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__CHARACTER_LABEL__ · 素材库预览</title><style>*{box-sizing:border-box}body{margin:0;background:#eae7de;color:#51463e;font:16px system-ui}main{max-width:1140px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6}.stage{background:linear-gradient(#eae7de 87%,#dcd6c8);border-radius:14px;overflow:hidden}canvas{width:100%;height:540px;display:block;touch-action:none;cursor:grab}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}button,select,a{color:inherit}button,select{background:#fff6e4;border:1px solid #b8aa91;border-radius:8px;padding:9px 12px}#phase{flex:1;min-width:140px;accent-color:#857258}.note{font-size:13px;color:#796f60}.compare main{padding:14px}.compare main>p,.compare .controls,.compare footer{display:none}.compare canvas{height:480px}@media(max-width:650px){main{padding:14px}canvas{height:410px}}</style><main><h1>__CHARACTER_LABEL__</h1><p>拖动旋转、滚轮缩放；播放、暂停时都可调整。动作与表情独立选择。</p><div class="controls"><select id="motion" aria-label="动作"></select><select id="expression" aria-label="表情"><option value="auto">表情随动作建议</option></select></div><div class="stage"><canvas id="view" aria-label="__CHARACTER_LABEL__三维预览"></canvas></div><div class="controls"><button id="play">暂停</button><button id="restart">从头播放</button><input type="range" id="phase" min="0" max="1" step=".01" value="0" aria-label="动作进度"><span id="status"></span></div><div class="controls"><button data-angle="0">正面</button><button data-angle="1.5708">侧面</button><button data-angle="3.14159">背面</button><button id="hand-left">抬左辫</button><button id="hand-right">抬右辫</button></div><footer><a href="__MODEL_FILE__" download>下载模型</a> · <a href="../../index.html">素材登记</a> · <a href="../../compare.html">双角色对比</a><p class="note">基础动作、复合配方、共用表情和角色组件独立保存。</p></footer></main><script>__RUNTIME__
const embedded=new URLSearchParams(location.search).has('compare');if(new URLSearchParams(location.search).has('compact')){const compactStyle=document.createElement('style');compactStyle.textContent='.compare canvas{height:310px}.compare main{padding:10px}';document.head.append(compactStyle);}if(embedded)document.body.classList.add('compare');const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),get=id=>document.getElementById(id),model=DATA.model,textures={},pointers=new Map(),hands={left:false,right:false};let effect='none';const layeredTextures={};let clip=DATA.preview?.default_motion||'idle',expression='neutral',time=0,playing=!embedded,ready=false,dirty=true,last=0,az=-.45,el=.14,span=DATA.preview?.span||14.5,centerY=DATA.preview?.centerY||9.5,bodyOnly=false;const expressionVertices={},baseRig=model.rig;let puffRig=null;const anatomy=DATA.anatomy?new AnatomyController(DATA.anatomy):null;let anatomyUI=null;
for(const kind of ['base','composite','variant']){const group=document.createElement('optgroup');group.label=kind==='base'?'基础动作':kind==='variant'?'形态动作':'复合动作';for(const m of Object.values(DATA.motions).filter(m=>m.kind===kind)){const op=document.createElement('option');op.value=m.id;op.textContent=m.label;group.append(op)}get('motion').append(group)}
for(const category of [...new Set(Object.values(DATA.expressions).map(e=>e.group))]){const g=document.createElement('optgroup');g.label=category;for(const e of Object.values(DATA.expressions).filter(e=>e.group===category)){const op=document.createElement('option');op.value=e.id;op.textContent=e.review_code+' · '+e.label+(e.origin==='new'?'（新增）':'（原有）');g.append(op)}get('expression').append(g)}get('motion').value=clip;get('expression').value=expression;
function selectedExpression(){if(expression!=='auto')return expression;const item=(DATA.presentation[clip]||[]).find(e=>time>=e.from&&time<e.to);return item?.expression||'neutral'}
function sync(){get('play').textContent=playing?'暂停':'播放';get('phase').max=DATA.motions[clip].duration;get('phase').value=time;get('status').textContent=time.toFixed(2)+' / '+DATA.motions[clip].duration.toFixed(2)+' 秒';}
get('motion').onchange=e=>{clip=e.target.value;time=0;dirty=true;sync()};get('expression').onchange=e=>{expression=e.target.value;dirty=true};get('play').onclick=()=>{playing=!playing;sync()};get('restart').onclick=()=>{time=0;playing=true;dirty=true;sync()};get('phase').oninput=e=>{time=+e.target.value;playing=false;dirty=true;sync()};document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{az=+b.dataset.angle;el=.12;centerY=DATA.preview?.centerY||9.5;dirty=true});
function setHands(){const o={};for(const side of ['left','right'])if(hands[side])o['hand_'+side]={rotation:[0,0,side==='left'?-35:35]};baseRig.boneOverrides=o;if(puffRig)puffRig.boneOverrides=o;dirty=true}
if(DATA.preview?.hand_label)for(const side of ['left','right'])get('hand-'+side).textContent='抬'+(side==='left'?'左':'右')+DATA.preview.hand_label;
for(const side of ['left','right'])get('hand-'+side).onclick=()=>{hands[side]=!hands[side];setHands()};
function sample(keys,t){const p=Object.entries(keys).map(([t,v])=>[+t,v]).sort((a,b)=>a[0]-b[0]);if(t<=p[0][0])return p[0][1];for(let i=1;i<p.length;i++)if(t<=p[i][0]){const [a,x]=p[i-1],[b,y]=p[i],q=(t-a)/(b-a);return x.map((v,j)=>v+(y[j]-v)*q)}return p[p.length-1][1]}
function rigFor(preset){if(!DATA.expressions[preset]?.requires?.includes('puff-cheeks')||clip==='puff')return baseRig;if(!puffRig){puffRig=structuredClone(baseRig);for(const c of Object.values(puffRig.clips))for(const [n,chs] of Object.entries(baseRig.clips.puff.tracks))if(/^puff_(left|right)/.test(n)){c.tracks[n]={};for(const [ch,keys] of Object.entries(chs))c.tracks[n][ch]={0:sample(keys,2.6)}}}puffRig.boneOverrides=baseRig.boneOverrides;return puffRig}
function shareCamera(){if(embedded)parent.postMessage({type:'standard-camera',az,el,span},'*')}
function distance(){const p=[...pointers.values()];return p.length===2?Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]):0}
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),before=distance();pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){az-=(e.clientX-old[0])*.009;el=Math.max(-1.1,Math.min(1.45,el+(e.clientY-old[1])*.009))}else if(before>0){span=Math.max(7,Math.min(30,span*before/distance()))}dirty=true;shareCamera()});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>pointers.delete(e.pointerId));canvas.addEventListener('wheel',e=>{e.preventDefault();span=Math.max(7,Math.min(30,span*Math.exp(e.deltaY*.001)));dirty=true;shareCamera()},{passive:false});
window.addEventListener('message',e=>{if(e.data?.type!=='standard-compare')return;const d=e.data;if(!DATA.motions[d.clip])return;clip=d.clip;time=d.time;expression=d.expression||'auto';effect=d.effect||'none';az=d.az;el=d.el;span=d.span;bodyOnly=!!d.bodyOnly;centerY=d.centerY??(DATA.preview?.centerY||9.5);playing=false;if(d.hands){hands.left=d.hands.left;hands.right=d.hands.right;setHands()}if(d.anatomy&&anatomy){anatomy.selectPart(d.anatomy.part);if(d.anatomy.extended)anatomy.extend();else anatomy.retract();}dirty=true;sync()});
Promise.all(Object.entries(DATA.textures).map(([id,src])=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=DATA.textureSize||128;const x=c.getContext('2d');x.drawImage(im,0,0);textures[id]=x.getImageData(0,0,c.width,c.height).data;res()};im.onerror=rej;im.src=src}))).then(()=>{ready=true;dirty=true;last=0}).catch(e=>get('status').textContent='贴图载入失败');

let trialParts=[],trialCache={},trialScales=[];
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='standard-part-trial')return;trialParts=e.data.parts||[];trialScales=e.data.scales||[];trialCache={};dirty=true});
function applyPartTrial(base,preset){if(!trialParts.length)return base;if(trialCache[preset])return trialCache[preset];const out=new Uint8ClampedArray(base),size=DATA.textureSize||128;for(const p of trialParts){const [u,v,U,V]=p.uv,[w,h]=p.size;for(let y=0;y<V-v;y++)for(let x=0;x<U-u;x++){const src=(Math.floor(y*h/(V-v))*w+Math.floor(x*w/(U-u)))*4,dst=((v+y)*size+u+x)*4;for(let c=0;c<4;c++)out[dst+c]=p.pixels[src+c]}}return trialCache[preset]=out}

function layerTexture(preset){const base=textures[preset]||textures.neutral;if(effect==='none'||!DATA.effects[effect])return applyPartTrial(base,preset);const key=preset+'/'+effect;if(layeredTextures[key])return layeredTextures[key];const tex=new Uint8ClampedArray(base);for(const part of DATA.effects[effect].parts){const [u,v,U,V]=part.uv,[w,h]=part.size;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const src=(y*w+x)*4,dst=((v+y)*(DATA.textureSize||128)+u+x)*4,a=part.pixels[src+3]/255;if(!a)continue;const old=tex[dst+3]/255,A=a+old*(1-a);for(let k=0;k<3;k++)tex[dst+k]=(part.pixels[src+k]*a+tex[dst+k]*old*(1-a))/A;tex[dst+3]=A*255;}}layeredTextures[key]=tex;return tex;}
function trialGeometry(source){if(!trialScales.length)return source;const out=source.slice();for(const p of trialScales){const start=p.index*288,lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(let i=start;i<start+288;i+=8)for(let j=0;j<3;j++){lo[j]=Math.min(lo[j],out[i+j]);hi[j]=Math.max(hi[j],out[i+j])}for(let i=start;i<start+288;i+=8)for(let j=0;j<3;j++){const c=(lo[j]+hi[j])/2;out[i+j]=c+(out[i+j]-c)*p.scale[j]+(p.position?.[j]||0)}}return out}
function frame(now){const dt=last?(now-last)/1000:0;last=now;if(anatomy?.update(dt))dirty=true;anatomyUI?.sync();if(playing&&ready){time+=dt;if(time>=DATA.motions[clip].duration)time%=DATA.motions[clip].duration;dirty=true;sync()}const w=Math.min(960,Math.round(canvas.clientWidth)),h=Math.round(canvas.clientHeight);if(w<1||h<1){requestAnimationFrame(frame);return}if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true}if(ready&&dirty){const preset=selectedExpression();let source=model.vertices;if(model.expressionPatches[preset]){if(!expressionVertices[preset]){const a=source.slice();for(const patch of model.expressionPatches[preset])for(let i=0;i<patch.vertices.length;i++)a[patch.index*288+i]=patch.vertices[i];expressionVertices[preset]=a}source=expressionVertices[preset]}source=trialGeometry(source);const poseRig=rigFor(preset),savedOverrides=poseRig.boneOverrides;if(anatomy)poseRig.boneOverrides={...savedOverrides,...anatomy.overrides()};let v=poseVertices(source,poseRig,time,true,false,clip);poseRig.boneOverrides=savedOverrides;if(bodyOnly)v=v.slice(0,model.bodyCubeCount*288);ctx.putImageData(new ImageData(renderModel(v,layerTexture(preset),w,h,az,el,Math.max(span,13*h/w),{centerY,textureSize:DATA.textureSize}),w,h),0,0);dirty=false}requestAnimationFrame(frame)}
