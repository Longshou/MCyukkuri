<div class="controls"><button data-angle="0">正面</button><button data-angle="-.55">前侧</button><button data-angle="1.570796">侧面</button><button data-angle="3.141593">背面</button><button id="reset">重置视角</button><label><input type="checkbox" id="body">只看共用身体</label></div>

<script src="catalog-data.js"></script><script>
const get=id=>document.getElementById(id),frames=[...document.querySelectorAll('iframe')];let clip='idle',expression='neutral',time=0,playing=false,last=0,az=0,el=.12,span=11.8,dirty=true;
for(const m of Object.values(CATALOG.motions)){const op=new Option(m.label,m.id);get('motion').add(op)}get('motion').value=clip;
for(const e of Object.values(CATALOG.expressions)){const op=new Option(e.label+(e.status==='needs-redraw'?'（待重绘）':''),e.id);get('expression').add(op)}get('expression').value=expression;
function sync(){get('play').textContent=playing?'暂停':'播放';get('phase').max=CATALOG.motions[clip].duration;get('phase').value=time;get('time').textContent=time.toFixed(2)+' / '+CATALOG.motions[clip].duration.toFixed(2)+' 秒';dirty=true}
get('motion').onchange=e=>{clip=e.target.value;time=0;sync()};get('expression').onchange=e=>{expression=e.target.value;sync()};get('play').onclick=()=>{playing=!playing;sync()};get('restart').onclick=()=>{time=0;sync()};get('phase').oninput=e=>{time=+e.target.value;playing=false;sync()};get('body').onchange=sync;
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{az=+b.dataset.angle;el=.12;sync()});get('reset').onclick=()=>{az=0;el=.12;span=11.8;sync()};frames.forEach(f=>f.onload=sync);
window.addEventListener('message',e=>{if(e.data?.type==='standard-camera'&&frames.some(f=>f.contentWindow===e.source)){({az,el,span}=e.data);sync()}});
function tick(now){if(last&&playing){time=(time+(now-last)/1000)%CATALOG.motions[clip].duration;sync()}last=now;if(dirty){for(const f of frames)f.contentWindow.postMessage({type:'standard-compare',clip,expression,time,az,el,span,centerY:6.4,bodyOnly:get('body').checked},'*');dirty=false}requestAnimationFrame(tick)}
window.speciesDebug={state:()=>({clip,time,playing,az,el,span}),setTime(t){time=t;playing=false;sync()}};document.addEventListener('visibilitychange',()=>last=0);sync();requestAnimationFrame(tick);
</script></html>
