<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>普通魔理沙 · 辫子互动</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eee9dd;color:#453e32;font:15px/1.6 system-ui}main{max-width:1280px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:25px;margin:0}p{margin:8px 0 18px}.muted{color:#7f7462;font-size:13px}a{color:#7d602c}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px}nav{display:flex;flex-direction:column;gap:9px}button,select{font:inherit;color:inherit;border:1px solid #c6b898;background:#fff9ec;border-radius:9px;padding:9px 13px;cursor:pointer}nav button{text-align:left}button[aria-pressed=true]{background:#655437;color:white;border-color:#655437}button:hover{border-color:#887145}.stage{border:1px solid #cec4af;border-radius:14px;overflow:hidden;background:linear-gradient(#ede9df,#f8f4e9)}canvas{display:block;width:100%;height:600px;touch-action:none;cursor:grab}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}input[type=range]{min-width:100px;flex:1;accent-color:#877144}.phase{border-left:3px solid #998057;padding:7px 13px;margin-top:10px;background:#e6decb}#steps{display:flex;flex-wrap:wrap;gap:6px}#steps button{font-size:12px;padding:4px 9px}footer{margin-top:22px;font-size:13px}#error{color:#963e30} @media(max-width:700px){main{padding:14px}.layout{grid-template-columns:1fr}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}nav button{font-size:13px;padding:7px}canvas{height:450px}header{display:block}h1{font-size:22px}}</style>
<main><header><div><div class="muted">普通魔理沙 / 动作研究 01</div><h1>用辫子，做一点日常小事</h1></div><a href="../../index.html">返回素材库</a></header><p>选择互动，拖动旋转视角。可暂停、拖动进度，观察辫梢接触与物品交接。</p><div class="layout"><nav id="actions" aria-label="互动动作"></nav><section><div class="stage"><canvas id="view" aria-label="魔理沙辫子互动三维预览"></canvas></div><div class="controls"><button id="play">暂停</button><button id="restart">重播</button><input id="time" type="range" min="0" step=".01" value="0" aria-label="动作进度"><span id="clock"></span><label><input id="loop" type="checkbox">循环</label><label>速度 <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label></div><div class="controls"><button data-view="front">正面</button><button data-view="three">斜侧</button><button data-view="side">侧面</button><button data-view="back">背面</button><button data-view="top">俯视</button></div><div class="phase" id="phase" aria-live="polite"></div><p class="muted" id="hint"></p><div id="steps"></div><p id="error" role="alert"></p></section></div><footer><a href="assembled/marisa-braids.bbmodel" download>可编辑模型与七项动画</a> · <a href="assembled/marisa-braids.animation.json" download>动画 JSON</a> · <a href="README.md">复用与接入说明</a> · <a href="REFERENCES.md">漫画、小说与设定出处</a><p class="muted">基于当前普通魔理沙标准模型的动作与道具预览。七项动作的节拍、抓握方式和帽沿落点为本项目适配。</p></footer></main>
<script>__RUNTIME__
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
let action='pick_stone',time=0,playing=true,ready=false,dirty=true,last=0,texture,az=-.38,el=.25,span=17.2;
const pointers=new Map(),rig=DATA.model.rig;
const hints={pick_stone:'卷住小石头 → 举起展示 → 放回地面 → 松开。',swing_sword:'辫梢卷握剑柄，完成两次挥动后把宝剑放下。',pull_grass:'先抓紧草根，再后拉拔出；根团露出并抖落泥土。',remove_hat:'双辫先扣帽沿；帽子抬离头顶后向前翻转，最后戴回。',care_hat:'取下帽子，转向自己后放低；左辫扶稳，右辫擦拭帽带、整理蝴蝶结，再托起戴回。',wave_goodbye:'右辫举起，来回摆动道别，再自然垂下。',lift_child:'双辫托底，平稳抬高，轻放帽沿；子油坐稳后双辫收回。'};
function sync(){const a=DATA.actions[action];$('play').textContent=playing?'暂停':'播放';$('time').max=a.duration;$('time').value=time;$('clock').textContent=time.toFixed(2)+' / '+a.duration.toFixed(1)+' 秒';$('phase').textContent=[...a.phases].reverse().find(([t])=>t<=time)?.[1]||'';for(const b of $('actions').children)b.setAttribute('aria-pressed',b.dataset.action===action);}
function select(id){if(!DATA.actions[id])return;action=id;time=0;playing=true;dirty=true;$('hint').textContent=hints[id];$('steps').replaceChildren();for(const [t,label] of DATA.actions[id].phases){const b=document.createElement('button');b.textContent=label;b.onclick=()=>setTime(t);$('steps').append(b)}sync()}
function setTime(t){time=Math.max(0,Math.min(DATA.actions[action].duration,t));playing=false;dirty=true;sync()}
for(const [id,a] of Object.entries(DATA.actions)){const b=document.createElement('button');b.textContent=a.label;b.dataset.action=id;b.onclick=()=>select(id);$('actions').append(b)}
$('play').onclick=()=>{if(!playing&&time>=DATA.actions[action].duration)time=0;playing=!playing;dirty=true;sync()};$('restart').onclick=()=>select(action);$('time').oninput=e=>setTime(+e.target.value);
const views={front:[0,.16],three:[-.55,.28],side:[Math.PI/2,.18],back:[Math.PI,.2],top:[0,1.2]};
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{[az,el]=views[b.dataset.view];dirty=true};
const distance=()=>{const p=[...pointers.values()];return p.length===2?Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1]):0};
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY])};
canvas.onpointermove=e=>{const old=pointers.get(e.pointerId);if(!old)return;const d=distance();pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){az-=(e.clientX-old[0])*.009;el=Math.max(-.6,Math.min(1.45,el+(e.clientY-old[1])*.009))}else if(d>0)span=Math.max(10,Math.min(27,span*d/distance()));dirty=true};
for(const e of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(e,event=>pointers.delete(event.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();span=Math.max(10,Math.min(27,span*Math.exp(e.deltaY*.001)));dirty=true},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();$('play').click()}});
const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.drawImage(im,0,0);texture=x.getImageData(0,0,256,256).data;ready=true;dirty=true};im.onerror=()=>{$('error').textContent='贴图加载失败，请重新打开预览。'};im.src=DATA.texture;
function pose(t=time,id=action){return poseVertices(DATA.model.vertices,rig,t,true,false,id)}
function draw(){const w=Math.min(1000,Math.round(canvas.clientWidth)),h=Math.round(canvas.clientHeight);if(w<1||h<1)return;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;dirty=true}if(!ready||!dirty)return;const p=pose();ctx.putImageData(new ImageData(renderModel(p,texture,w,h,az,el,Math.max(span,17*h/w),{centerY:8.8,textureSize:256}),w,h),0,0);dirty=false}
function frame(now){const dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(ready&&playing){time+=dt*+$('speed').value;const duration=DATA.actions[action].duration;if(time>=duration){if($('loop').checked)time%=duration;else{time=duration;playing=false}}dirty=true;sync()}draw();requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>last=0);
window.braidDebug={ready:()=>ready,select,setTime,state:()=>({action,time,playing,az,el,span}),pose,model:()=>DATA.model,draw,metadata:()=>DATA.samples[action]};
select(new URLSearchParams(location.search).get('action')||action);requestAnimationFrame(frame);
</script></html>
