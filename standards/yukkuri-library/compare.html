<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>油库里 · 动作与表情对照</title><style>*{box-sizing:border-box}body{margin:22px;background:#eae7de;color:#51463e;font:16px system-ui}h1{font-size:25px;margin:0 0 8px}p{line-height:1.65}button,select{padding:8px 12px;background:#fff7e8;border:1px solid #b8aa91;border-radius:8px;color:inherit;cursor:pointer}button.active{background:#625641;color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.label{width:78px;font-weight:600}.motions{display:flex;gap:8px;flex-wrap:wrap}#phase{flex:1;min-width:180px;accent-color:#857258}#status{min-width:126px}#expression{max-width:250px}input[type=search]{padding:8px;width:150px;border:1px solid #b8aa91;border-radius:8px;background:#fff7e8}.note{font-size:13px;color:#796f60}a{color:#795625}.stages{display:flex;gap:12px}iframe{width:50%;height:570px;border:1px solid #b8aa91;border-radius:12px}.recipe{padding:12px;background:#f7f0e1;border-radius:10px;margin:12px 0}#exprThumb{width:64px;height:50px;object-fit:contain;image-rendering:pixelated;vertical-align:middle}#sequenceSteps{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}#sequenceSteps span{font-size:12px;padding:4px 8px;background:#e8decc;border-radius:5px}@media(max-width:750px){body{margin:14px}.stages{flex-direction:column}iframe{width:100%}.label{width:auto}}</style><h1>油库里 · 动作与表情对照</h1><p class="note">拖动任一角色同步旋转，滚轮缩放，触屏可双指缩放。播放和暂停均可调整。<a href="index.html">素材登记与表情图鉴</a></p><div class="row"><span class="label">基础动作</span><div id="base" class="motions"></div></div><div class="row"><span class="label">复合动作</span><div id="composite" class="motions"></div></div><div class="recipe"><strong id="motionTitle"></strong><span id="recipe"></span><div id="sequenceSteps"></div></div><div class="row"><button id="play">暂停</button><button id="restart">从头播放</button><label><input type="checkbox" id="loop" checked>循环</label><label><input type="checkbox" id="autoplay">依次播放当前分类</label><select id="speed" aria-label="播放速度"><option value=".5">0.5 倍速</option><option value="1" selected>1 倍速</option><option value="1.5">1.5 倍速</option></select><input id="phase" type="range" min="0" max="1" step=".01" value="0" aria-label="动作进度"><span id="status"></span></div><div class="row"><img id="exprThumb" alt="当前表情"><label>表情 <select id="expression" aria-label="共用表情"><option value="auto">随动作建议</option></select></label><label>叠加 <select id="effect" aria-label="表情效果"><option value="none">无</option></select></label><input id="filter" type="search" placeholder="搜索表情" aria-label="搜索表情"><button id="toggleVersion">切换同名版本</button><span id="exprSource" class="note"></span></div><div class="row"><button data-angle="0">正面</button><button data-angle="1.5708">侧面</button><button data-angle="3.14159">背面</button><button data-angle="2.3">后侧</button><button id="camera">重置视角</button><button id="hand-left">抬左辫</button><button id="hand-right">抬右辫</button><label><input type="checkbox" id="body">只看身体</label></div><div class="row" id="anatomy-row"><label>伸缩部位 <select id="anatomy-part"><option value="peni">佩尼佩尼</option><option value="mamu">麻姆麻姆</option></select></label><button id="anatomy-extend">两者伸出所选</button><button id="anatomy-retract">两者缩回</button><span class="note">两角色同步检查；每个角色只显现一种。</span></div><div class="stages"><iframe title="魔理沙" src="assembled/marisa/index.html?compare=1"></iframe><iframe title="灵梦" src="assembled/reimu/index.html?compare=1"></iframe></div><script src="catalog-data.js"></script><script>
const get=id=>document.getElementById(id),frames=[...document.querySelectorAll('iframe')],motions=CATALOG.motions,exprs=CATALOG.expressions,params=new URLSearchParams(location.search),hands={left:false,right:false};let clip=params.get('motion')||'taiso',expression=params.get('expression')||'auto',time=0,playing=true,last=0,az=-.45,el=.14,span=14.5,category='composite',lastExpr='';let anatomyExtended=false;if(!motions[clip])clip='taiso';if(CATALOG.expressionAliases[expression])expression=CATALOG.expressionAliases[expression];if(expression!=='auto'&&!exprs[expression])expression='neutral';category=motions[clip].kind;
function drawRecipe(){const m=motions[clip];get('motionTitle').textContent=m.label+' · ';get('recipe').textContent=m.description;get('sequenceSteps').replaceChildren();for(const id of (m.kind==='composite'?m.base_dependencies:m.dependencies)){const s=document.createElement('span');s.textContent='基础：'+motions[id].label;get('sequenceSteps').append(s)}document.querySelectorAll('[data-clip]').forEach(b=>b.classList.toggle('active',b.dataset.clip===clip))}
function select(id){clip=id;category=motions[id].kind;time=0;playing=true;drawRecipe();sync()}
for(const [id,e] of Object.entries(CATALOG.effects)){const o=document.createElement('option');o.value=id;o.textContent=e.review_code+' · '+e.label+(e.origin==='new'?'（新增）':'（原有）');get('effect').append(o)}
for(const m of Object.values(motions)){const b=document.createElement('button');b.textContent=m.label;b.dataset.clip=m.id;b.onclick=()=>select(m.id);get(m.kind).append(b)}
function expressionOptions(filter=''){const current=expression;get('expression').replaceChildren();const auto=document.createElement('option');auto.value='auto';auto.textContent='随动作建议';get('expression').append(auto);for(const group of [...new Set(Object.values(exprs).map(e=>e.group))]){const g=document.createElement('optgroup');g.label=group;for(const e of Object.values(exprs).filter(e=>e.group===group&&(e.id===current||!filter||(e.review_code+' '+e.label+' '+e.id+' '+e.sources.map(s=>s.field).join(' ')).toLowerCase().includes(filter.toLowerCase())))){const o=document.createElement('option');o.value=e.id;o.textContent=e.review_code+' · '+e.label+(e.origin==='new'?'（新增）':'（原有）');g.append(o)}if(g.children.length)get('expression').append(g)}get('expression').value=current}
get('toggleVersion').onclick=()=>{const pair=exprs[expression]?.review_pair;if(pair){expression=pair;expressionOptions(get('filter').value);sync()}};
function sync(){get('toggleVersion').disabled=!exprs[expression]?.review_pair;get('play').textContent=playing?'暂停':'播放';get('phase').max=motions[clip].duration;get('phase').value=time;get('status').textContent=time.toFixed(2)+' / '+motions[clip].duration.toFixed(2)+' 秒';if(lastExpr!==expression){lastExpr=expression;get('exprThumb').src='expressions/thumbnails/'+(expression==='auto'?'neutral':expression)+'.png';get('exprSource').textContent=expression==='auto'?'表情按独立演出建议切换，可随时手动指定。':((exprs[expression].sources.length?'对应原版 '+exprs[expression].sources.length+' 个字段':'项目保留表情')+' · 两个角色共用 · '+(exprs[expression].origin==='new'?'新增版 · 待核对':'原有版')+' · '+exprs[expression].review_code)}}
get('expression').onchange=e=>{expression=e.target.value;sync()};get('filter').oninput=e=>expressionOptions(e.target.value);get('play').onclick=()=>{playing=!playing;sync()};get('restart').onclick=()=>select(clip);get('phase').oninput=e=>{time=+e.target.value;playing=false;sync()};get('camera').onclick=()=>{az=-.45;el=.14;span=14.5};document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{az=+b.dataset.angle;el=.12});for(const side of ['left','right'])get('hand-'+side).onclick=()=>{hands[side]=!hands[side];get('hand-'+side).classList.toggle('active',hands[side])};
get('anatomy-extend').onclick=()=>anatomyExtended=true;get('anatomy-retract').onclick=()=>anatomyExtended=false;
window.addEventListener('message',e=>{if(e.data?.type==='standard-camera'&&frames.some(f=>f.contentWindow===e.source)){az=e.data.az;el=e.data.el;span=e.data.span}});
function tick(now){if(last&&playing)time+=(now-last)/1000*+get('speed').value;last=now;const duration=motions[clip].duration;if(time>=duration&&playing){if(get('autoplay').checked){const list=Object.values(motions).filter(m=>m.kind===category);select(list[(list.findIndex(m=>m.id===clip)+1)%list.length].id)}else if(get('loop').checked)time%=duration;else{time=duration;playing=false}}sync();for(const frame of frames)frame.contentWindow.postMessage({type:'standard-compare',clip,time,expression,az,el,span,bodyOnly:get('body').checked,hands,effect:get('effect').value,anatomy:{part:get('anatomy-part').value,extended:anatomyExtended}},'*');requestAnimationFrame(tick)}document.addEventListener('visibilitychange',()=>last=0);expressionOptions();drawRecipe();sync();requestAnimationFrame(tick);
</script></html>
