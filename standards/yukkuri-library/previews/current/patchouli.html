    for(let j=0;j<3;j++){
      const k=i+j*8,x=vertices[k],y=vertices[k+1]-(options.centerY ?? 9.5),z=vertices[k+2];
      tri.push([width/2+(x*right[0]+z*right[2])*scale,
        height/2-(x*up[0]+y*up[1]+z*up[2])*scale,
        x*eye[0]+y*eye[1]+z*eye[2],vertices[k+3]*textureSize,vertices[k+4]*textureSize]);
    }
    const [a,b,d]=tri;
    const det=(b[1]-d[1])*(a[0]-d[0])+(d[0]-b[0])*(a[1]-d[1]);
    if(Math.abs(det)<1e-8)continue;
    const x0=Math.max(0,Math.floor(Math.min(a[0],b[0],d[0]))),x1=Math.min(width-1,Math.ceil(Math.max(a[0],b[0],d[0])));
    const y0=Math.max(0,Math.floor(Math.min(a[1],b[1],d[1]))),y1=Math.min(height-1,Math.ceil(Math.max(a[1],b[1],d[1])));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const wa=((b[1]-d[1])*(x+.5-d[0])+(d[0]-b[0])*(y+.5-d[1]))/det;
      const wb=((d[1]-a[1])*(x+.5-d[0])+(a[0]-d[0])*(y+.5-d[1]))/det,wc=1-wa-wb;
      if(wa< -1e-7||wb< -1e-7||wc< -1e-7)continue;
      const z=wa*a[2]+wb*b[2]+wc*d[2],index=y*width+x;
      // Keep first coplanar face, preventing overlapping cuboids from flickering.
      if(z<=depth[index]+1e-7)continue;

      const solid=vertices[i+3]<0 ? options.colors?.[-1-vertices[i+3]] : null;
      const u=Math.max(0,Math.min(textureSize-1,Math.floor(wa*a[3]+wb*b[3]+wc*d[3])));
      const v=Math.max(0,Math.min(textureSize-1,Math.floor(wa*a[4]+wb*b[4]+wc*d[4])));
      const t=(v*textureSize+u)*4,p=index*4;
      if(!solid && texture[t+3]<128)continue;
      depth[index]=z;
      pixels[p]=Math.floor((solid?solid[0]:texture[t])*light);pixels[p+1]=Math.floor((solid?solid[1]:texture[t+1])*light);pixels[p+2]=Math.floor((solid?solid[2]:texture[t+2])*light);pixels[p+3]=255;
    }
  }
  return pixels;
}

const canvas = root.querySelector('.model-view');
const ctx = canvas.getContext('2d');
const status = root.querySelector('.model-status');
const zoom = root.querySelector('input');
const zoomValue = root.querySelector('.zoom-value');
const buttons = [...root.querySelectorAll('[data-angle]')];
const bytes = Uint8Array.from(atob(DATA.vertices), c => c.charCodeAt(0));
const packed = new DataView(bytes.buffer);
const vertices = new Float32Array(bytes.length / 2);
for (let i = 0; i < vertices.length; i++) vertices[i] = packed.getInt16(i * 2, true) / 1024;
const posed = poseVertices(vertices, DATA.rig, 0, true, false, 'idle');
let az = 0, el = .12, texture = null, pending = false;
const pointers = new Map();
function draw() {
  pending = false;
  if (!texture) return;
  const w = Math.max(1, Math.round(canvas.clientWidth));
  const h = Math.max(1, Math.round(canvas.clientHeight));
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;
  const span = Math.max(DATA.preview.span, 13 * h / w) * 100 / Number(zoom.value);
  ctx.putImageData(new ImageData(renderModel(posed, texture, w, h, az, el, span, {
    centerY: DATA.preview.centerY, textureSize: DATA.textureSize
  }), w, h), 0, 0);
}
function redraw() { if (!pending) { pending = true; requestAnimationFrame(draw); } }
function setZoom(value) {
  zoom.value = String(Math.max(65, Math.min(180, Math.round(value))));
  zoomValue.textContent = zoom.value + '%';
  redraw();
}
zoom.addEventListener('input', () => setZoom(zoom.value));
buttons.forEach(button => button.addEventListener('click', () => {
  az = Number(button.dataset.angle); el = .12;
  buttons.forEach(other => other.setAttribute('aria-pressed', String(other === button)));
  redraw();
}));
function distance() {
  const p = [...pointers.values()];
  return p.length === 2 ? Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) : 0;
}
canvas.addEventListener('pointerdown', event => {
  pointers.set(event.pointerId, [event.clientX, event.clientY]);
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', event => {
  if (!pointers.has(event.pointerId)) return;
  const old = pointers.get(event.pointerId), before = distance();
  pointers.set(event.pointerId, [event.clientX, event.clientY]);
  if (pointers.size === 1) {
    az -= (event.clientX - old[0]) * .009;
    el = Math.max(-1.1, Math.min(1.45, el + (event.clientY - old[1]) * .009));
    buttons.forEach(button => button.setAttribute('aria-pressed', 'false'));
  } else if (before > 0) setZoom(Number(zoom.value) * distance() / before);
  redraw();
});
for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(name, event => pointers.delete(event.pointerId));
}
canvas.addEventListener('wheel', event => {
  event.preventDefault(); setZoom(Number(zoom.value) * Math.exp(-event.deltaY * .001));
}, {passive:false});
new ResizeObserver(redraw).observe(canvas);
const atlas = new Image();
atlas.onload = () => {
  const buffer = document.createElement('canvas');
  buffer.width = buffer.height = DATA.textureSize;
  const context = buffer.getContext('2d');
  context.drawImage(atlas, 0, 0);
  texture = context.getImageData(0, 0, buffer.width, buffer.height).data;
  status.textContent = '帕秋莉 · 刘海调整 · 拖动旋转';
  redraw();
};
atlas.onerror = () => { status.textContent = '贴图载入失败'; };
atlas.src = DATA.texture;
})();
</script>
