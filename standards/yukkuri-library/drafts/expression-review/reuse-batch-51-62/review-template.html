<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>泪花 A/B 差分 · 睁眼哭喊与寒冷发颤</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eae7de;color:#51463e;font:15px system-ui}main{max-width:1500px;margin:auto;padding:18px}h1{font-size:25px;margin:0}h2{font-size:21px;margin:0}p{line-height:1.6;margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}button,select{font:inherit;background:#fff7e8;border:1px solid #b8aa91;border-radius:8px;padding:9px 13px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#c9d6bb;border-color:#738660}.note{font-size:13px;color:#796f60}.panel{background:#fff7e8;padding:14px 16px;border-radius:10px}.comparisons{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.col{min-width:0}.label{font-size:18px;font-weight:bold;padding:12px;background:#dcd1bd;border-radius:10px 10px 0 0}.after .label{background:#c9d6bb}iframe{width:100%;height:360px;display:block;border:1px solid #b8aa91;background:#eae7de}.pixelrow{display:flex;align-items:center;gap:20px;height:98px;padding:10px;background:#e5d0a7;overflow:auto}.pixelrow canvas{image-rendering:pixelated}.saved{margin-top:16px}a{color:#536848}@media(max-width:700px){main{padding:10px}.comparisons{gap:7px}iframe{height:325px}.label{font-size:15px}}
</style>
<main>
<h1>泪花 A/B 差分 · 睁眼哭喊与寒冷发颤</h1>
<p>左侧为上轮同形稿，右侧为本轮差分。A 保留细薄水光，B 的泪花更宽、更饱满，眼神与嘴型相同。</p>
<p class="note">N057 已恢复老版嘴；本批其他八项已保存。全部表情剩余 27 项待确认。<a href="../../previews/current/pending-batch.png">A/B 并排总览</a> · <a href="../../previews/current/pending-batch-oblique.png">斜侧面</a></p>
<div class="row"><button id="prev">上一张</button><select id="expression" aria-label="选择表情"></select><button id="next">下一张</button><span id="count"></span><button id="phase">A/B 切换</button><button id="front">正面</button><button id="angle">斜侧面</button></div>
<section class="panel"><h2 id="title"></h2><div class="row" id="variants"></div><p id="change"></p><p class="note" id="note"></p></section>
<div class="comparisons"><section class="col"><div class="label" id="beforeHeader">复用前</div><div class="pixelrow" id="beforeParts"></div><iframe title="复用前魔理沙" src="../../assembled/marisa/index.html?compare=1&amp;compact=1"></iframe><iframe title="复用前灵梦" src="../../assembled/reimu/index.html?compare=1&amp;compact=1"></iframe></section><section class="col after"><div class="label" id="afterHeader">复用后</div><div class="pixelrow" id="afterParts"></div><iframe title="复用后魔理沙" src="../../assembled/marisa/index.html?compare=1&amp;compact=1"></iframe><iframe title="复用后灵梦" src="../../assembled/reimu/index.html?compare=1&amp;compact=1"></iframe></section></div>
<section class="panel saved"><p>两组均沿用已确认的 N012 泪花像素，通过饱满程度形成差分。后续表情同样优先用泪花，并检查 A/B 在实际模型上可见地区分。</p><p><a href="reuse-batch-51-62/round3/README.md">本轮差分与保存记录</a> · <a href="reuse-batch-51-62/round2/REFERENCE.md">原图与场景依据</a></p></section>
</main>
<script>
const DATA=__DATA__;
const get=id=>document.getElementById(id),frames=[...document.querySelectorAll('iframe')];
let selected=0,az=0,el=.04,span=11;
function active(){const r=DATA.rows[selected];return r.variants[r.variantIndex||0]}
function send(){const r=DATA.rows[selected],v=active();frames.forEach((f,i)=>{const name=i%2===0?'marisa':'reimu',parts=i<2?(v.before||r.before):v.parts,transforms=i<2?(v.before_transforms||r.before_transforms):v.transforms;f.contentWindow.postMessage({type:'standard-compare',clip:'idle',time:0,expression:i<2?(r.before_id||r.id):r.id,az,el,span,effect:'none',hands:{left:false,right:false}},'*');f.contentWindow.postMessage({type:'standard-part-trial',scales:Object.entries(transforms).map(([slot,t])=>({index:DATA.indices[name][slot],...t})),parts:Object.entries(parts).map(([slot,p])=>({...p,uv:DATA.bindings[name][slot]}))},'*')})}
function pixels(target,parts,slots){get(target).replaceChildren();for(const slot of slots){const p=parts[slot],c=document.createElement('canvas');[c.width,c.height]=p.size;c.title=slot;c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(p.pixels),...p.size),0,0);c.style.width=c.width*3+'px';c.style.height=c.height*3+'px';get(target).append(c)}}
function show(){const r=DATA.rows[selected],v=active();get('expression').value=String(selected);get('count').textContent=(selected+1)+' / '+DATA.rows.length;get('title').textContent=r.code+' · '+r.label;get('beforeHeader').textContent=v.beforeLabel||r.beforeLabel||'修改前';get('change').textContent=v.description;get('note').textContent=r.note;get('afterHeader').textContent=r.afterLabel||(r.code+(r.variants.length>1?'–'+v.key:'')+' · '+v.label);get('variants').replaceChildren();if(r.variants.length>1)r.variants.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x.key+' · '+x.label;b.setAttribute('aria-pressed',String((r.variantIndex||0)===i));b.onclick=()=>{r.variantIndex=i;show()};get('variants').append(b)});const beforeParts=v.before||r.before;const slots=Object.keys(v.parts).filter(n=>JSON.stringify(beforeParts[n])!==JSON.stringify(v.parts[n]));pixels('beforeParts',beforeParts,slots);pixels('afterParts',v.parts,slots);send()}
DATA.rows.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.code+' · '+r.label;get('expression').append(o)});
get('expression').onchange=e=>{selected=+e.target.value;show()};get('prev').onclick=()=>{selected=(selected+DATA.rows.length-1)%DATA.rows.length;show()};get('next').onclick=()=>{selected=(selected+1)%DATA.rows.length;show()};get('front').onclick=()=>{az=0;el=.04;send()};get('angle').onclick=()=>{az=-.45;el=.14;send()};
get('phase').onclick=()=>{const id=DATA.rows[selected].id,other=id.endsWith('_b')?id.slice(0,-2):id+'_b',i=DATA.rows.findIndex(r=>r.id===other);if(i>=0){selected=i;show()}};
window.addEventListener('message',e=>{if(e.data?.type==='standard-camera'&&frames.some(f=>f.contentWindow===e.source)){az=e.data.az;el=e.data.el;span=e.data.span;send()}});for(const f of frames)f.addEventListener('load',send);show();setInterval(send,250);
</script></html>
