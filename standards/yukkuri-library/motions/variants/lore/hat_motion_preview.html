<header><div><p class="eyebrow">MCYUKKURI · 连续动作预览</p><h1>压低近缘，咬缘，滑回船上</h1><p>看完整动作、接触过程和前后衔接。打开后自动播放，可慢放或拖动进度。</p></div><a class="back" href="../index.html?topic=hat-motion">返回预览总入口 ↗</a></header>

<section class="player" aria-label="三维动作播放器">
<div class="viewport" id="viewport"><canvas id="view" aria-label="连续三维动作预览；拖动可转动视角" tabindex="0"></canvas><div class="topline"><span class="phase" id="phase">正在准备动作</span><span class="scene-time" id="scene-time">当前模型 · 离线演示</span></div><div class="subtitle" id="subtitle" aria-live="polite"></div><div class="loading" id="loading"><strong>正在载入当前模型和连续动作…</strong><small>播放后可用空格暂停、方向键逐秒查看。</small></div></div>
<div class="timeline"><input id="seek" type="range" min="0" max="1" step="0.02" value="0" aria-label="播放进度" disabled><output id="time">0:00 / 0:00</output></div>
<div class="controls"><button id="play" class="primary" disabled>暂停</button><button id="replay" disabled>从头播放</button><label class="setting">速度 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><button id="sound" aria-pressed="false" disabled>开启声音</button><label class="setting"><input id="sequence" type="checkbox" checked>连续播放三段</label><div class="view-controls"><label class="setting"><input id="detail" type="checkbox">接触近景</label><button id="reset-view">还原视角</button><button id="fullscreen">全屏</button></div></div>
</section>

<p class="note">这是按当前模型、动作与运动规则制作的连续离线演示。用于查看演出衔接；自然触发、碰撞结果与自救成功率仍待游戏实测。</p>
