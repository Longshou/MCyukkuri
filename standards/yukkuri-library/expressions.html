<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵梦与魔理沙 · 表情对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eae7de;color:#51463e;font:16px system-ui}main{max-width:1500px;margin:auto;padding:22px}h1{font-size:25px;margin:0 0 8px}p{line-height:1.6;margin:8px 0 16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}button,select,input{font:inherit;padding:9px 12px;background:#fff7e8;border:1px solid #b8aa91;border-radius:8px;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}#expression{min-width:260px;max-width:100%}input{width:190px}.note{font-size:13px;color:#796f60}#thumb{width:80px;height:63px;object-fit:contain;image-rendering:pixelated;border-radius:8px}.stages{display:grid;grid-template-columns:1fr 1fr;gap:14px}iframe{width:100%;height:575px;border:1px solid #b8aa91;border-radius:12px;background:#eae7de}.current{background:#fff7e8;padding:12px 16px;border-radius:10px;display:flex;gap:16px;align-items:center}#title{font-size:19px}#details{margin-top:5px}#count{margin-left:auto}a{color:#795625}@media(max-width:650px){main{padding:12px}.stages{gap:7px}iframe{height:430px}#expression{min-width:0;width:100%}.row{gap:6px}button,select,input{font-size:14px}}
</style>
<main><h1>灵梦与魔理沙 · 表情对比</h1><p class="note">两角色同步显示同一表情。拖动角色旋转，滚轮缩放。O 是原有版，N 是新增版。</p>
<div class="row"><select id="origin" aria-label="表情版本"><option value="">全部版本</option><option value="original">原有版</option><option value="new">新增版</option></select><input id="search" type="search" placeholder="搜索名称或编号" aria-label="搜索表情"><span id="count"></span></div>
<div class="row"><button id="prev">上一个</button><select id="expression" aria-label="表情"></select><button id="next">下一个</button><button id="pair">切换同名版本</button></div>
<div class="current"><img id="thumb" alt="当前表情"><div><strong id="title"></strong><div id="details" class="note"></div></div></div>
<div class="row"><button id="front">正面</button><button id="angle">斜侧面</button><button id="reset">重置视角</button></div>
<div class="stages"><iframe title="魔理沙表情" src="assembled/marisa/index.html?compare=1"></iframe><iframe title="灵梦表情" src="assembled/reimu/index.html?compare=1"></iframe></div></main>
<script src="catalog-data.js"></script><script>
const get=id=>document.getElementById(id),exprs=CATALOG.expressions,frames=[...document.querySelectorAll('iframe')];
let expression=new URLSearchParams(location.search).get('expression')||'happy',az=0,el=.04,span=13,visible=[];
if(!exprs[expression])expression='neutral';
function send(){for(const f of frames)f.contentWindow.postMessage({type:'standard-compare',clip:'idle',time:0,expression,az,el,span,effect:'none',bodyOnly:false,hands:{left:false,right:false}},'*')}
function show(){const e=exprs[expression];get('expression').value=expression;get('title').textContent=e.review_code+' · '+e.label;get('details').textContent=(e.origin==='original'?'原有版':'新增版')+' · '+e.id+' · 可按编号反馈修改要求';get('thumb').src='expressions/thumbnails/'+expression+'.png';get('pair').disabled=!exprs[e.review_pair];get('count').textContent=visible.length+' 个表情';get('prev').disabled=get('next').disabled=visible.length<2;send()}
function options(){const q=get('search').value.trim().toLowerCase(),origin=get('origin').value;visible=Object.values(exprs).filter(e=>(!origin||e.origin===origin)&&(!q||(e.review_code+' '+e.id+' '+e.label).toLowerCase().includes(q)));get('expression').replaceChildren();for(const e of visible){const o=document.createElement('option');o.value=e.id;o.textContent=e.review_code+' · '+e.label+'（'+(e.origin==='original'?'原有':'新增')+'）';get('expression').append(o)}if(visible.length&&!visible.some(e=>e.id===expression))expression=visible[0].id;show();if(!visible.length)get('count').textContent='没有匹配的表情；保留当前预览'}
get('expression').onchange=e=>{expression=e.target.value;show()};get('search').oninput=options;get('origin').onchange=options;
function step(d){if(!visible.length)return;expression=visible[(visible.findIndex(e=>e.id===expression)+d+visible.length)%visible.length].id;show()}
get('prev').onclick=()=>step(-1);get('next').onclick=()=>step(1);get('pair').onclick=()=>{const pair=exprs[expression].review_pair;if(!exprs[pair])return;expression=pair;get('search').value='';get('origin').value='';options()};
get('front').onclick=()=>{az=0;el=.04;send()};get('angle').onclick=()=>{az=-.45;el=.14;send()};get('reset').onclick=()=>{az=0;el=.04;span=13;send()};
window.addEventListener('message',e=>{if(e.data?.type==='standard-camera'&&frames.some(f=>f.contentWindow===e.source)){az=e.data.az;el=e.data.el;span=e.data.span;send()}});
for(const f of frames)f.addEventListener('load',send);options();setInterval(send,150);
</script></html>
